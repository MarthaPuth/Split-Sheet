<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Split Sheet</title>
<style>
:root{
  --bg:#070A11; --bg2:#0C111C;
  --tx:#F2F5FA; --mut:#98A2B8; --dim:#69738A;
  --line:rgba(255,255,255,.08);
  --accent:#B79BFF;
  --good:#6FE9A6; --fair:#F5CB6B; --poor:#FF7A8A;
  --sleep:var(--accent); --run:var(--accent); --ready:var(--accent);
  --gym:var(--accent); --cal:var(--accent); --coach:var(--accent); --warn:var(--poor);
  --a1:#B79BFF; --a2:#8E7BD8; --glow:.30;
  --f:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue','Segoe UI',system-ui,sans-serif;
  --m:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue','Segoe UI',system-ui,sans-serif;
  --r:24px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--f);font-size:15px;
  line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:108px;letter-spacing:-.01em;
  font-variant-numeric:tabular-nums}
.mono{font-family:var(--m);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.02em}
.wrap{max-width:940px;margin:0 auto;padding:0 15px}
.hide{display:none!important}

/* ---------- glass ---------- */
.glass{
  background:linear-gradient(155deg,rgba(255,255,255,.075),rgba(255,255,255,.028));
  backdrop-filter:blur(22px) saturate(150%);
  -webkit-backdrop-filter:blur(22px) saturate(150%);
  border:1px solid rgba(255,255,255,.085);
  border-radius:var(--r);
  box-shadow:0 10px 34px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.09);
}
.card{position:relative;padding:20px;margin-bottom:12px;
  background:linear-gradient(155deg,rgba(255,255,255,.075),rgba(255,255,255,.028));
  backdrop-filter:blur(22px) saturate(150%);
  -webkit-backdrop-filter:blur(22px) saturate(150%);
  border:1px solid rgba(255,255,255,.085);
  border-radius:var(--r);
  box-shadow:0 10px 34px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.09)}
.card>h2{font-size:11px;color:var(--mut);font-weight:600;letter-spacing:.13em;
  text-transform:uppercase;margin-bottom:15px}
.card .sub{color:var(--mut);font-size:13.5px;margin-top:8px;line-height:1.5}
.row{display:grid;gap:10px}
.r2{grid-template-columns:1fr 1fr}
.r3{grid-template-columns:repeat(3,1fr)}
@media(max-width:560px){.r3{grid-template-columns:1fr 1fr}}

/* ---------- header ---------- */
.hd{padding:24px 0 14px;position:relative}
.hd .d{font-size:12.5px;color:var(--mut);letter-spacing:.02em}
.hd h1{font-size:27px;margin-top:4px;font-weight:650}
.hd .cd{font-size:12px;color:var(--dim);margin-top:6px;font-variant-numeric:tabular-nums}
.hd .cd b{color:var(--accent);font-weight:500}
.upd{position:absolute;top:24px;right:0;
  background:rgba(255,255,255,.08);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.1);color:var(--tx);
  font-family:var(--f);font-size:12px;font-weight:500;padding:9px 15px;border-radius:100px;cursor:pointer}

/* ---------- score strip (Oura-style mini rings) ---------- */
.strip{display:flex;gap:9px;overflow-x:auto;padding:2px 0 8px;margin-bottom:12px;
  scrollbar-width:none;-ms-overflow-style:none}
.strip::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-width:76px;padding:11px 12px 10px;text-align:center;
  background:linear-gradient(155deg,rgba(255,255,255,.07),rgba(255,255,255,.025));
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.08);border-radius:18px;cursor:pointer}
.chip.on{border-color:rgba(255,255,255,.22);background:linear-gradient(155deg,rgba(255,255,255,.13),rgba(255,255,255,.05))}
.chip .cv{font-size:20px;font-weight:500;letter-spacing:-.02em;line-height:1;margin-bottom:5px;color:var(--tx)}
.chip .cl{font-size:9.5px;color:var(--dim);letter-spacing:.07em;text-transform:uppercase}

/* ---------- spotlight ---------- */
.spot{text-align:center;padding:26px 20px 22px}
.spot .gauge{position:relative;display:inline-block}
.spot .gv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.spot .gn{font-family:var(--f);font-size:52px;font-weight:250;line-height:1;letter-spacing:-.04em}
.spot .gq{font-size:13px;font-weight:600;letter-spacing:.02em;margin-top:5px}
.spot h3{font-size:21px;font-weight:650;margin:16px 0 8px}
.spot p{margin:0;font-size:14px;color:var(--mut);line-height:1.55;max-width:38ch;
  margin-left:auto;margin-right:auto}

/* ---------- metric card (Oura Vitals) ---------- */
.met{display:block;width:100%;text-align:left;padding:16px 17px;margin-bottom:9px;cursor:pointer;
  background:linear-gradient(155deg,rgba(255,255,255,.06),rgba(255,255,255,.022));
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.075);border-radius:20px;
  font-family:var(--f);color:var(--tx)}
.met-top{display:flex;align-items:center;gap:12px}
.met-ic{width:38px;height:38px;border-radius:12px;flex:0 0 auto;display:flex;
  align-items:center;justify-content:center;font-size:17px}
.met-lab{flex:1;min-width:0}
.met-lab .l{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);font-weight:600}
.met-lab .v{display:flex;align-items:baseline;gap:7px;margin-top:3px}
.met-lab .v b{font-size:27px;font-weight:300;letter-spacing:-.03em;line-height:1}
.met-lab .v u{text-decoration:none;font-size:12px;color:var(--mut)}
.met-lab .v em{font-style:normal;font-size:13.5px;font-weight:600}
.met-arrow{color:var(--dim);font-size:16px;flex:0 0 auto;transition:transform .22s}
.met.open .met-arrow{transform:rotate(90deg)}
.met-note{font-size:12.5px;color:var(--mut);margin-top:10px;line-height:1.5}
.met-body{margin-top:13px;padding-top:13px;border-top:1px solid var(--line);font-size:13px;color:var(--mut);line-height:1.55}
.met-body .kv{display:flex;justify-content:space-between;padding:6px 0}
.met-body .kv span:last-child{font-family:var(--m);color:var(--tx)}

/* range bar */
.rng{position:relative;height:4px;border-radius:3px;margin-top:12px;
  background:linear-gradient(90deg,rgba(255,122,138,.5),rgba(245,203,107,.5),rgba(111,233,166,.55))}
.rng i{position:absolute;top:50%;width:11px;height:11px;border-radius:50%;background:#fff;
  transform:translate(-50%,-50%);box-shadow:0 0 0 3px rgba(7,10,17,.85),0 2px 6px rgba(0,0,0,.5)}
.rng-lbl{display:flex;justify-content:space-between;font-family:var(--m);font-size:9.5px;
  color:var(--dim);margin-top:6px}

/* ---------- nav: a floating slab of glass ---------- */
nav{position:fixed;z-index:20;display:flex;gap:2px;
  left:11px;right:11px;bottom:calc(11px + env(safe-area-inset-bottom));
  padding:6px;border-radius:27px;
  background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.05));
  backdrop-filter:blur(38px) saturate(190%);
  -webkit-backdrop-filter:blur(38px) saturate(190%);
  border:1px solid rgba(255,255,255,.13);
  box-shadow:0 14px 44px rgba(0,0,0,.55),
             inset 0 1px 0 rgba(255,255,255,.22),
             inset 0 -1px 0 rgba(0,0,0,.22)}
nav button{flex:1;min-width:0;background:none;border:0;color:var(--dim);cursor:pointer;
  padding:9px 2px 10px;border-radius:21px;position:relative;
  font-family:var(--f);font-size:9.5px;font-weight:500;letter-spacing:.01em}
nav button .ic{display:block;font-size:16px;line-height:1;margin-bottom:5px}
nav button[aria-selected=true]{
  color:var(--accent);
  background:linear-gradient(160deg,rgba(255,255,255,.17),rgba(255,255,255,.07));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.26),
             inset 0 -1px 0 rgba(0,0,0,.14),
             0 2px 10px rgba(0,0,0,.22)}
nav button:focus-visible{outline:2px solid var(--tx);outline-offset:-3px}
@media(min-width:720px){
  body{padding-bottom:26px;padding-top:14px}
  nav{position:sticky;top:14px;bottom:auto;left:auto;right:auto;
    max-width:520px;margin:0 auto 18px;border-radius:100px;padding:5px}
  nav button{flex:1;padding:10px 14px;font-size:12.5px;border-radius:100px}
  nav button .ic{display:none}
}

/* ---------- aurora ---------- */
#aurora{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 0%,var(--bg2) 0%,var(--bg) 60%)}
#aurora i{position:absolute;width:78vmax;height:78vmax;border-radius:50%;filter:blur(90px);
  opacity:var(--glow,.38);transition:opacity 1.2s ease,background 1.2s ease}
#aurora i:nth-child(1){left:-24vmax;top:-32vmax;background:radial-gradient(circle,var(--a1) 0%,transparent 68%);
  animation:drift1 30s ease-in-out infinite}
#aurora i:nth-child(2){right:-28vmax;top:-8vmax;background:radial-gradient(circle,var(--a2) 0%,transparent 68%);
  animation:drift2 36s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(5vmax,4vmax) scale(1.09)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-4vmax,5vmax) scale(1.06)}}
@media(prefers-reduced-motion:reduce){#aurora i{animation:none!important}}

/* ---------- motion ---------- */
.ring circle[data-off],.gauge circle[data-off]{transition:stroke-dashoffset 1.2s cubic-bezier(.16,1,.3,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card,.met,.chip{animation:cardIn .5s cubic-bezier(.16,1,.3,1) both}
.card:nth-of-type(2){animation-delay:45ms}.card:nth-of-type(3){animation-delay:90ms}
.card:nth-of-type(4){animation-delay:135ms}.card:nth-of-type(5){animation-delay:180ms}
.met:nth-of-type(2){animation-delay:40ms}.met:nth-of-type(3){animation-delay:80ms}
.met:nth-of-type(4){animation-delay:120ms}.met:nth-of-type(5){animation-delay:160ms}
.view-pane{animation:paneIn .3s ease both}
@keyframes paneIn{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){
  .card,.met,.chip,.view-pane{animation:none}
  .ring circle[data-off],.gauge circle[data-off]{transition:none}
}
button{-webkit-tap-highlight-color:transparent}
nav button,.seg button,.upd,.met,.chip,.coach-chip,.coach-send,.cal-cell,.cal-nav,.acct-btn{
  transition:transform .13s ease,opacity .13s ease,border-color .2s ease}
nav button:active,.seg button:active,.upd:active,.met:active,.chip:active,
.coach-chip:active,.coach-send:active,.cal-cell:active,.cal-nav:active,.acct-btn:active{transform:scale(.97);opacity:.88}

/* ---------- ring (small) ---------- */
.ringbox{display:flex;align-items:center;gap:20px}
.ring{flex:0 0 auto;position:relative}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .val .n{font-family:var(--f);font-size:25px;font-weight:300;line-height:1;letter-spacing:-.03em}
.ring .val .s{font-size:9px;color:var(--dim);letter-spacing:.11em;text-transform:uppercase;margin-top:3px}
.ringbox .meta{min-width:0}
.ringbox .big{font-size:24px;font-weight:600;letter-spacing:-.025em}
.ringbox .lab{font-size:13px;color:var(--mut);margin-top:3px}
.ringbox .note{font-size:13.5px;color:var(--mut);margin-top:10px;line-height:1.5}

/* ---------- stat ---------- */
.stat{padding:14px;border-radius:17px;
  background:linear-gradient(155deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.07)}
.stat .k{font-size:10px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.stat .v{font-family:var(--f);font-size:23px;font-weight:300;margin-top:6px;line-height:1.1;letter-spacing:-.03em}
.stat .u{font-size:11px;color:var(--mut);margin-left:3px}
.stat .sub{font-size:11.5px;color:var(--dim);margin-top:4px}

/* ---------- contributor bars ---------- */
.cb{margin-bottom:12px}
.cb:last-child{margin-bottom:0}
.cb .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.cb .t span:last-child{font-family:var(--m);color:var(--mut)}
.cb .bar{height:5px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden}
.cb .bar i{display:block;height:100%;border-radius:3px}

/* ---------- stages ---------- */
.stages{display:flex;height:34px;border-radius:11px;overflow:hidden;margin:6px 0 12px;gap:2px}
.stages div{display:flex;align-items:center;justify-content:center;
  font-size:10px;color:#12101C;font-weight:600}
.slegend{display:flex;gap:15px;flex-wrap:wrap;font-size:11.5px;color:var(--mut)}
.slegend i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:6px}

/* ---------- list ---------- */
.li{display:flex;gap:13px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0;padding-bottom:0}
.li:first-child{padding-top:0}
.li .dt{flex:0 0 42px;text-align:center}
.li .dt .dd{font-family:var(--m);font-size:17px;font-weight:500;line-height:1}
.li .dt .mo{font-size:9.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.li .mid{flex:1;min-width:0}
.li .mid .n{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .mid .s{font-size:12px;color:var(--dim);margin-top:3px;font-family:var(--m)}
.li .rt{text-align:right;font-family:var(--m);flex:0 0 auto}
.li .rt .a{font-size:15px}
.li .rt .b{font-size:11px;color:var(--dim);margin-top:3px}
.pill{display:inline-block;font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;
  border-radius:100px;font-weight:700;vertical-align:1px;margin-left:7px}

/* ---------- session ---------- */
.sess{padding:15px 16px;margin-bottom:9px;border-radius:18px;
  background:linear-gradient(155deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.07);border-left:3px solid var(--accent)}
.sess.strength{border-left-color:rgba(255,255,255,.22)}
.sess.rest{border-left-color:var(--dim)}
.sess .tag{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600}
.sess .nm{font-size:17px;font-weight:600;margin:5px 0 3px;letter-spacing:-.02em}
.sess .dt2{font-size:13px;color:var(--mut)}
.sess .vol{float:right;font-size:13px;font-weight:500;color:var(--accent)}

/* ---------- timeline ---------- */
.tl{position:relative;padding-left:19px}
.tl:before{content:'';position:absolute;left:4px;top:6px;bottom:6px;width:1px;background:var(--line)}
.tli{position:relative;padding:0 0 17px}
.tli:last-child{padding-bottom:0}
.tli:before{content:'';position:absolute;left:-19px;top:5px;width:9px;height:9px;border-radius:50%;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16)}
.tli.key:before{background:var(--ready);border-color:var(--ready)}
.tli .tm{font-family:var(--m);font-size:11.5px;font-weight:500;color:var(--ready)}
.tli .tx{font-size:13.5px;color:var(--mut);margin-top:3px;line-height:1.5}
.tli.key .tx{color:var(--tx)}

/* ---------- charts ---------- */
svg.ch{width:100%;height:auto;display:block}
.chl{display:flex;gap:15px;flex-wrap:wrap;font-size:11px;color:var(--dim);margin-top:11px;font-family:var(--m)}
.chl i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px}

/* ---------- misc ---------- */
.note{font-size:13.5px;color:var(--mut);line-height:1.55}
.note b{color:var(--tx);font-weight:600}
.seg{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.seg button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.07);color:var(--mut);
  font-family:var(--f);font-size:12px;padding:8px 14px;border-radius:100px;cursor:pointer}
.seg button[aria-selected=true]{background:var(--tx);color:var(--bg);font-weight:600;border-color:transparent}
.bar-mini{height:4px;border-radius:2px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:8px}
.bar-mini i{display:block;height:100%;border-radius:2px}
.sync{font-family:var(--m);font-size:11px;color:var(--dim);text-align:center;padding:20px 0 6px}
.sync button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);color:var(--mut);
  font-family:var(--m);font-size:11px;padding:7px 14px;border-radius:100px;cursor:pointer;margin-left:8px}
ul.tight{margin:9px 0 0;padding-left:18px;font-size:13.5px;color:var(--mut)}
ul.tight li{margin-bottom:5px}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warn);margin-right:6px;vertical-align:2px}

/* ---------- panel: accounts ---------- */
.dz{border:1.5px dashed rgba(255,255,255,.14);border-radius:18px;padding:24px 18px;text-align:center;
  background:rgba(255,255,255,.03);transition:border-color .15s}
.dz.over{border-color:var(--sleep)}
.dz .big2{font-size:15px;font-weight:600;margin-bottom:5px}
.dz .sm{font-size:12.5px;color:var(--mut)}
.dz input{position:absolute;width:1px;height:1px;opacity:0}
.dz label{color:var(--sleep);text-decoration:underline;cursor:pointer}
.log{font-family:var(--m);font-size:12px;color:var(--mut);margin-top:14px;line-height:1.7}
.log .ok{color:var(--gym)} .log .no{color:var(--warn)}
.savebtn{background:var(--tx);color:var(--bg);border:0;font-family:var(--f);font-size:13px;font-weight:600;
  padding:13px 20px;border-radius:100px;cursor:pointer;margin-top:16px;width:100%}
.savebtn[disabled]{opacity:.35;cursor:default}
.acct-row{display:flex;align-items:center;gap:13px;padding:15px 0;border-bottom:1px solid var(--line)}
.acct-row:last-child{border-bottom:0}
.acct-dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.15);flex:0 0 auto}
.acct-dot.on{background:var(--gym);box-shadow:0 0 10px rgba(111,233,166,.5)}
.acct-body{flex:1;min-width:0}
.acct-name{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.acct-tag{font-family:var(--m);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);
  border:1px solid var(--line);border-radius:100px;padding:2px 8px}
.acct-sub{font-size:12.5px;color:var(--dim);margin-top:3px;line-height:1.45}
.acct-btn{font-family:var(--f);font-size:12.5px;font-weight:600;padding:9px 15px;border-radius:100px;
  text-decoration:none;flex:0 0 auto;white-space:nowrap;border:0;cursor:pointer}
.acct-btn.connect{background:var(--ready);color:#070A11}
.acct-btn.disconnect{background:rgba(255,255,255,.07);color:var(--mut);border:1px solid var(--line)}
.manual-toggle{background:none;border:0;color:var(--dim);font-family:var(--f);font-size:12.5px;
  text-decoration:underline;cursor:pointer;padding:0;margin-top:16px}
.steps{counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding:0 0 15px 32px;font-size:13.5px;color:var(--mut);line-height:1.5}
.steps li:last-child{padding-bottom:0}
.steps li:before{content:counter(s);position:absolute;left:0;top:0;width:21px;height:21px;border-radius:50%;
  background:rgba(255,255,255,.08);color:var(--tx);font-family:var(--m);font-size:11px;
  display:flex;align-items:center;justify-content:center}
.steps li b{color:var(--tx);font-weight:600}

/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:center;gap:11px;margin-bottom:16px}
.cal-title{font-size:17px;font-weight:600;flex:1;letter-spacing:-.02em}
.cal-nav{background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--tx);width:34px;height:34px;
  border-radius:12px;cursor:pointer;font-size:15px;line-height:1;flex:0 0 auto}
.cal-today-btn{background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--mut);
  font-family:var(--f);font-size:12px;padding:8px 13px;border-radius:100px;cursor:pointer;flex:0 0 auto}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:5px}
.cal-dow span{text-align:center;font-family:var(--m);font-size:9.5px;color:var(--dim);letter-spacing:.06em}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-cell{background:rgba(255,255,255,.045);border-radius:12px;min-height:62px;padding:6px 4px 5px;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;
  border:1px solid rgba(255,255,255,.05);overflow:hidden}
.cal-cell.out{opacity:.25}
.cal-cell.today{border-color:rgba(255,255,255,.35)}
.cal-cell.sel{border-color:var(--cal);background:rgba(245,203,107,.1)}
.cal-cell.rest{background:rgba(255,255,255,.018)}
.cal-dnum{font-family:var(--m);font-size:11.5px;color:var(--mut);line-height:1}
.cal-cell.today .cal-dnum{color:var(--tx);font-weight:500}
.cal-mi{font-size:12px;font-weight:500;color:var(--tx);margin-top:4px;line-height:1.1}
.cal-plan{font-size:8.5px;color:var(--dim);margin-top:3px;line-height:1.15;text-align:center;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.cal-hard{width:5px;height:5px;border-radius:50%;background:var(--warn);margin-top:3px;flex:0 0 auto}
.cal-sleep{width:100%;height:3px;border-radius:2px;background:rgba(255,255,255,.08);margin-top:auto;overflow:hidden}
.cal-sleep i{display:block;height:100%;border-radius:2px;background:var(--accent)}
.cal-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--dim);margin-top:14px;font-family:var(--m)}
.cal-legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.cal-wk-row{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.cal-wk-row:last-child{border-bottom:0}
.cal-wk-row.is-today{background:rgba(245,203,107,.07);border-radius:14px;padding-left:11px;padding-right:11px}
.cal-wk-date{flex:0 0 42px;text-align:center}
.cal-wk-date .d{font-family:var(--m);font-size:17px;font-weight:500;line-height:1}
.cal-wk-date .m{font-size:9.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.cal-wk-mid{flex:1;min-width:0}
.cal-wk-mid .n{font-size:14px;font-weight:500}
.cal-wk-mid .s{font-size:11.5px;color:var(--dim);margin-top:3px;font-family:var(--m)}
.cal-wk-rt{text-align:right;font-family:var(--m);font-size:11.5px;flex:0 0 auto;color:var(--mut)}

/* ---------- coach ---------- */
.coach-log-inline{display:flex;flex-direction:column;gap:10px;max-height:340px;overflow-y:auto;
  padding:4px 2px 12px}
.msg{max-width:84%;padding:12px 15px;border-radius:19px;font-size:14px;line-height:1.5;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--ready);color:#070A11;border-bottom-right-radius:6px;font-weight:500}
.msg.coach{align-self:flex-start;border-bottom-left-radius:6px;color:var(--tx);
  background:linear-gradient(160deg,rgba(255,255,255,.11),rgba(255,255,255,.04));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.msg.sys{align-self:center;color:var(--dim);font-size:12.5px;background:none;padding:4px}
.typing{align-self:flex-start;background:rgba(255,255,255,.08);border-radius:19px;border-bottom-left-radius:6px;
  padding:13px 16px;display:flex;gap:5px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--dim);animation:tbounce 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tbounce{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:2px 0 13px}
.coach-chip{color:var(--mut);font-family:var(--f);font-size:12.5px;padding:9px 15px;
  border-radius:100px;cursor:pointer;text-align:left;
  background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.035));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.coach-input{display:flex;gap:8px}
.coach-input textarea{flex:1;resize:none;border-radius:17px;color:var(--tx);
  background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.12);
  font-family:var(--f);font-size:14.5px;padding:12px 15px;max-height:110px}
.coach-input textarea:focus{outline:2px solid var(--ready);outline-offset:1px}
.coach-send{background:var(--ready);color:#070A11;border:0;border-radius:17px;padding:0 19px;
  font-weight:600;cursor:pointer;font-size:14px;font-family:var(--f)}
.coach-send[disabled]{opacity:.4;cursor:default}
.coach-note{font-size:11.5px;color:var(--dim);text-align:center;padding:11px 8px 0;line-height:1.5}
.coach-clear{font-family:var(--m);font-size:10.5px;color:var(--dim);background:none;border:0;
  cursor:pointer;text-decoration:underline}

/* ---------- coach: floating button ---------- */
.coach-fab{position:fixed;right:14px;z-index:30;display:flex;align-items:center;gap:8px;
  bottom:calc(96px + env(safe-area-inset-bottom));
  padding:12px 19px;border-radius:100px;cursor:pointer;
  border:1px solid rgba(196,168,255,.42);
  background:linear-gradient(158deg,rgba(183,155,255,.34),rgba(142,123,216,.16));
  backdrop-filter:blur(30px) saturate(200%);-webkit-backdrop-filter:blur(30px) saturate(200%);
  color:#EFE8FF;font-family:var(--f);font-size:14px;font-weight:600;letter-spacing:-.01em;
  box-shadow:0 12px 32px rgba(0,0,0,.5),

             inset 0 1px 0 rgba(255,255,255,.34),
             inset 0 -1px 0 rgba(0,0,0,.18)}
.coach-fab .fab-ic{font-size:15px;line-height:1}
.coach-fab:active{transform:scale(.95)}
@media(min-width:720px){.coach-fab{bottom:26px;right:26px;padding:14px 21px;font-size:15px}}

/* ---------- coach: sheet ---------- */
.coach-sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.coach-bg{position:absolute;inset:0;background:rgba(3,5,10,.62);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:fadeIn .22s ease both}
.coach-panel{position:relative;width:100%;max-width:620px;max-height:86vh;display:flex;flex-direction:column;
  padding:8px 16px calc(16px + env(safe-area-inset-bottom));
  border-radius:30px 30px 0 0;overflow:hidden;
  background:linear-gradient(168deg,rgba(255,255,255,.11),rgba(255,255,255,.035) 42%,rgba(10,13,22,.5));
  backdrop-filter:blur(46px) saturate(200%);-webkit-backdrop-filter:blur(46px) saturate(200%);
  border:1px solid rgba(255,255,255,.15);border-bottom:0;
  box-shadow:0 -18px 60px rgba(0,0,0,.6),
             inset 0 1px 0 rgba(255,255,255,.3);
  animation:sheetUp .3s cubic-bezier(.16,1,.3,1) both}
.coach-panel:before{content:'';position:absolute;top:0;left:12%;right:12%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);pointer-events:none}
@media(min-width:720px){
  .coach-sheet{align-items:center}
  .coach-panel{border-radius:30px;border-bottom:1px solid rgba(255,255,255,.15);
    max-height:76vh;padding-bottom:16px;animation:sheetPop .26s cubic-bezier(.16,1,.3,1) both}
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetPop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){
  .coach-bg,.coach-panel{animation:none}
}
.coach-grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.22);
  margin:2px auto 12px;flex:0 0 auto}
@media(min-width:720px){.coach-grab{display:none}}
.coach-hd{display:flex;align-items:flex-start;gap:12px;padding:0 2px 12px;flex:0 0 auto}

.coach-sub{font-size:12.5px;color:var(--mut);margin-top:2px}
.coach-x{background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--mut);
  width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:12px;flex:0 0 auto;

.coach-log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;

.coach-empty{text-align:center;padding:34px 18px;color:var(--dim);font-size:13.5px;line-height:1.6}

<script>
const SNAP=JSON.parse(document.getElementById('snap').textContent);
const SNAPPLAN=JSON.parse(document.getElementById('snapplan').textContent);
let DATA=SNAP, PLAN=SNAPPLAN;
const $=s=>document.querySelector(s);
const D=s=>new Date(s+'T00:00:00');
const kd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const NAT='2026-11-21', REG='2026-11-13';
const dd=(a,b)=>Math.round((D(b)-D(a))/864e5);
const num=(v,d=0)=>v==null||isNaN(v)?'–':(+v).toFixed(d);
const hm=h=>h==null?'–':`${Math.floor(h)}h ${String(Math.round((h%1)*60)).padStart(2,'0')}m`;
const clock=h=>h==null?'–':`${String(Math.floor(h)).padStart(2,'0')}:${String(Math.round((h%1)*60)).padStart(2,'0')}`;
let TODAY=kd(new Date());

/* ---------- shared bits ---------- */
/* ---------- design helpers ---------- */

/* Oura-style plain-English verdict from a 0-100 score */
function qual(v){
  if(v==null) return {w:'No data',c:'var(--dim)'};
  if(v>=85) return {w:'Optimal',c:'var(--good)'};
  if(v>=70) return {w:'Good',c:'var(--good)'};
  if(v>=60) return {w:'Fair',c:'var(--fair)'};
  return {w:'Pay attention',c:'var(--poor)'};
}
/* colour is reserved for verdicts — a gauge is green, amber or red by its own number,
   never by which tab it happens to live on */
function scoreColor(v){ return v==null?'var(--dim)':qual(v).c; }

/* 270° arc gauge for the spotlight */
function gauge(score,color,size=178,stroke=11){
  const r=(size-stroke)/2, c=2*Math.PI*r, sweep=.75, dash=c*sweep;
  const pct=Math.max(0,Math.min(100,score||0));
  const off=dash*(1-pct/100);
  return `<div class="gauge" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" style="transform:rotate(135deg)">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.07)"
        stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${dash} ${c}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}"
        stroke-width="${stroke}" stroke-linecap="round"
        stroke-dasharray="${dash} ${c}" stroke-dashoffset="${dash}" data-off="${off}"/>
    </svg>
    <div class="gv"><span class="gn" data-count="${score==null?'':Math.round(score)}">${score==null?'–':'0'}</span></div>
  </div>`;
}

/* the big card at the top of a tab: score, verdict, headline, plain-English read */
function spotlight(score,color,headline,body){
  const q=qual(score);
  return `<div class="card spot">
    ${gauge(score,scoreColor(score))}
    <div style="margin-top:-34px"><span class="gq" style="color:${q.c}">${q.w}</span></div>
    <h3>${headline}</h3><p>${body}</p>
  </div>`;
}

/* where a value sits inside a sensible range, Oura's slider */
function rangeBar(val,lo,hi,loLab,hiLab){
  if(val==null) return '';
  const pct=Math.max(2,Math.min(98,((val-lo)/(hi-lo))*100));
  return `<div class="rng"><i style="left:${pct}%"></i></div>
    <div class="rng-lbl"><span>${loLab||lo}</span><span>${hiLab||hi}</span></div>`;
}

/* expandable metric row — the Vitals pattern */
let metOpen={};
function metric(o){
  const open=!!metOpen[o.id];
  return `<button class="met ${open?'open':''}" data-met="${o.id}">
    <div class="met-top">
      <span class="met-ic" style="background:${o.tint||'rgba(255,255,255,.07)'};color:${o.color}">${o.icon}</span>
      <span class="met-lab">
        <span class="l">${o.label}</span>
        <span class="v"><b>${o.value}</b>${o.unit?`<u>${o.unit}</u>`:''}${o.verdict?`<em style="color:${o.vcolor||'var(--mut)'}">${o.verdict}</em>`:''}</span>
      </span>
      <span class="met-arrow">›</span>
    </div>
    ${o.range||''}
    ${o.note?`<div class="met-note">${o.note}</div>`:''}
    ${open&&o.detail?`<div class="met-body">${o.detail}</div>`:''}
  </button>`;
}
function wireMetrics(tab){
  const pane=$('#v-'+tab); if(!pane||!pane.addEventListener) return;
  pane.addEventListener('click',e=>{
    const b=e.target.closest?e.target.closest('[data-met]'):null;
    if(!b) return;
    metOpen[b.dataset.met]=!metOpen[b.dataset.met];
    VIEWS[tab](); wireMetrics(tab); animateVisuals(pane);
  });
}
function kv(k,v){ return `<div class="kv"><span>${k}</span><span>${v}</span></div>`; }

function ring(score,color,sub,size=104,stroke=9){
  const r=(size-stroke)/2, c=2*Math.PI*r, pct=Math.max(0,Math.min(100,score||0));
  const off=c*(1-pct/100);
  return `<div class="ring" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surf2)" stroke-width="${stroke}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-off="${off}"/>
    </svg>
    <div class="val"><span class="n" data-count="${score==null?'':Math.round(score)}">${score==null?'–':'0'}</span><span class="s">${sub}</span></div></div>`;
}

/* reveals rings and counts up numbers after the DOM has actually painted */
function animateVisuals(root){
  const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const scope=root||document;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    scope.querySelectorAll('circle[data-off]').forEach(c=>{ c.style.strokeDashoffset=c.dataset.off; });
    scope.querySelectorAll('[data-count]').forEach(el=>{
      const raw=el.dataset.count; if(raw===''){ return; }
      const target=+raw;
      if(reduced){ el.textContent=target; return; }
      const start=performance.now(), dur=700;
      const step=now=>{
        const t=Math.min(1,(now-start)/dur), e=1-Math.pow(1-t,3);
        el.textContent=Math.round(target*e);
        if(t<1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
  }));
}
function bars(obj,color,labels){
  return Object.entries(obj||{}).filter(([,v])=>v!=null).map(([k,v])=>
    `<div class="cb"><div class="t"><span>${labels[k]||k.replace(/_/g,' ')}</span><span>${Math.round(v)}</span></div>
     <div class="bar"><i style="width:${Math.max(2,Math.min(100,v))}%;background:${color}"></i></div></div>`).join('');
}
function trend(rows,field,color,h=110,band){
  const v=rows.filter(r=>r[field]!=null);
  if(v.length<2) return '<div class="note">Not enough data yet.</div>';
  const W=600, mn=Math.min(...v.map(r=>r[field])), mx=Math.max(...v.map(r=>r[field])), rg=(mx-mn)||1;
  const x=i=>i/(v.length-1)*(W-8)+4, y=z=>h-8-((z-mn)/rg)*(h-22);
  const pts=v.map((r,i)=>[x(i),y(r[field])]);
  let s='';
  if(band!=null&&band>=mn&&band<=mx) s+=`<line x1="4" y1="${y(band)}" x2="${W-4}" y2="${y(band)}" stroke="${color}" stroke-dasharray="3 5" opacity=".35"/>`;
  s+=`<polyline fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p=>p.join(',')).join(' ')}"/>`;
  s+=`<circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="3.5" fill="${color}"/>`;
  return `<svg class="ch" viewBox="0 0 ${W} ${h}" preserveAspectRatio="none" role="img" aria-label="${field} trend">${s}</svg>
    <div class="chl"><span>${v[0].day.slice(5)}</span><span style="margin-left:auto">${v[v.length-1].day.slice(5)} · now ${num(v[v.length-1][field],1)}</span></div>`;
}

    `${strength.length} strength sessions this week`,

/* ---------- COACH (floating button + sheet, reachable from anywhere) ---------- */
const COACH_CHIPS={
  today:["How should today's session feel?","Should I go easier or harder?","What should I eat today?"],
  sleep:["Why is my sleep score low?","How do I stop waking in the night?","Is my sleep hurting my training?"],
  runs:["Am I running too much right now?","How does my load look?","Was that session too fast?"],
  gym:["My calf feels tight — what should I do?","Should I lift today?","When should I use the sauna?"],
  cal:["How does this week look?","What should I prioritise this month?","Am I on track for November?"]
};
const COACH_PLACEHOLDER={
  today:'Ask about today…', sleep:'Ask about your sleep…', runs:'Ask about your running…',
  gym:'Ask about strength, aches or recovery…', cal:'Ask about your plan…'
};
let coachMsgs=[], coachLive=false, coachBusy=false, coachOpen=false;

function coachEscape(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function coachBubble(role,text){
  const cls=role==='user'?'me':(role==='assistant'?'coach':'sys');
  return `<div class="msg ${cls}">${coachEscape(text)}</div>`;
}

function drawCoach(){
  const fab=$('#coachFab'), sheet=$('#coachSheet');
  if(!fab||!sheet) return;

  fab.className='coach-fab'+(coachOpen?' hide':'');
  fab.innerHTML=`<span class="fab-ic">✦</span><span class="fab-tx">Ask coach</span>`;

  sheet.className='coach-sheet'+(coachOpen?'':' hide');
  if(!coachOpen){ sheet.innerHTML=''; return; }

  const chips=COACH_CHIPS[view]||COACH_CHIPS.today;
  sheet.innerHTML=`
    <div class="coach-bg" id="coachBg"></div>
    <div class="coach-panel">
      <div class="coach-grab"></div>
      <div class="coach-hd">
        <div>
          <div class="coach-ttl">Coach</div>
          <div class="coach-sub">${coachLive?'Reading your '+({today:'day',sleep:'sleep',runs:'running',gym:'recovery',cal:'plan'}[view]||'data'):'Not connected'}</div>
        </div>
        ${coachMsgs.length?'<button class="coach-clear" id="coachClear">Clear</button>':''}
        <button class="coach-x" id="coachX" aria-label="Close">✕</button>
      </div>
      <div class="coach-log" id="coachLog">
        ${coachMsgs.length
          ? coachMsgs.map(m=>coachBubble(m.role,m.content)).join('')+(coachBusy?'<div class="typing"><i></i><i></i><i></i></div>':'')
          : `<div class="coach-empty"><span class="ic">✦</span>
              Ask about today's session, an ache, or what to eat.<br>
              It reads your real numbers — and never edits the plan itself.</div>`}
      </div>
      ${!coachMsgs.length?`<div class="chips" id="coachChips">
        ${chips.map(c=>`<button class="coach-chip" data-q="${coachEscape(c)}">${c}</button>`).join('')}
      </div>`:''}
      <div class="coach-input">
        <textarea id="coachBox" rows="1" placeholder="${coachLive?(COACH_PLACEHOLDER[view]||'Ask your coach…'):'Add an API key to switch this on'}" ${coachLive?'':'disabled'}></textarea>
        <button class="coach-send" id="coachSend" ${coachLive?'':'disabled'}>Ask</button>
      </div>
      <div class="coach-note">Guidance only, grounded in your data — not a diagnosis. See a physio for anything that doesn't ease up.</div>
    </div>`;

  const box=$('#coachBox'), send=$('#coachSend'), log=$('#coachLog');
  if(box){
    box.addEventListener('input',()=>{ box.style.height='auto'; box.style.height=Math.min(110,box.scrollHeight)+'px'; });
    box.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); coachSend(box.value); } });
    if(coachLive&&window.matchMedia&&!window.matchMedia('(max-width:719px)').matches) box.focus();
  }
  if(send) send.addEventListener('click',()=>coachSend(box?box.value:''));
  const chipsEl=$('#coachChips');
  if(chipsEl) chipsEl.addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) coachSend(b.dataset.q); });
  const x=$('#coachX'); if(x) x.addEventListener('click',closeCoach);
  const bg=$('#coachBg'); if(bg) bg.addEventListener('click',closeCoach);
  const clr=$('#coachClear'); if(clr) clr.addEventListener('click',coachClear);
  if(log) log.scrollTop=log.scrollHeight;
}

function openCoach(){ coachOpen=true; drawCoach(); }
function closeCoach(){ coachOpen=false; drawCoach(); }

async function coachSend(text){
  text=(text||'').trim(); if(!text||coachBusy||!coachLive) return;
  const asked=view;
  coachMsgs.push({role:'user',content:text});
  coachBusy=true; drawCoach();
  try{
    const r=await fetch('/api/coach',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:text, view:asked})});
    const d=await r.json();
    coachBusy=false;
    if(d.reply) coachMsgs.push({role:'assistant',content:d.reply});
    else coachMsgs.push({role:'assistant',content:'That didn\'t go through: '+(d.error||'unknown error')+'. Try again in a moment.'});
  }catch(e){
    coachBusy=false;
    coachMsgs.push({role:'assistant',content:'Could not reach the coach — check your connection and try again.'});
  }
  drawCoach();
}
async function coachClear(){
  coachMsgs=[];
  try{ await fetch('/api/coach/history',{method:'DELETE'}); }catch(e){}
  drawCoach();
}
async function coachLoadHistory(){
  try{
    const r=await fetch('/api/coach/history');
    if(!r.ok) return;
    const d=await r.json();
    coachMsgs=(d.messages||[]).map(m=>({role:m.role,content:m.content}));
    coachLive=true;
  }catch(e){}
}

function mondayOf(d){ const o=(d.getDay()+6)%7; return new Date(d.getTime()-o*864e5); }

function dayDetail(k){
  const rec=dayMap()[k], p=PLAN[k];
  if(!rec&&!p) return '<div class="note">Nothing recorded or scheduled for this day.</div>';

  const bits=[];

      <div class="stat"><div class="k">Avg HR</div><div class="v">${num(rec.hr)}</div><div class="sub">bpm</div></div>
      <div class="stat"><div class="k">Time</div><div class="v">${rec.min?Math.floor(rec.min/60)+':'+String(Math.round(rec.min%60)).padStart(2,'0'):'–'}</div><div class="sub">h:mm</div></div>
    </div>`);
  } else if(past&&p&&!p.rest){
    bits.push('<div class="note" style="margin-bottom:12px">No run logged on this day.</div>');
  }
  if(rec&&rec.tst!=null){
    bits.push(`<div class="row r3">
      <div class="stat"><div class="k">Slept</div><div class="v">${hm(rec.tst)}</div>
        <div class="sub">${rec.eff!=null?rec.eff+'% eff':''}</div></div>

    </div>`);
  }
  return bits.join('')||'<div class="note">Nothing recorded for this day.</div>';
}

function viewCalendar(){

      if(rec) wkMi+=rec.mi||0;
      const ran=rec&&rec.km>0;
      const planTxt=p&&p.items&&p.items.length?p.items.map(x=>x.name).join(' · '):'—';
      const sub=[];
      if(ran) sub.push(`ran ${num(rec.mi,1)} mi${rec.hr?` · ${rec.hr} bpm`:''}`);
      else if(past&&p&&!p.rest) sub.push('not logged');
      if(rec&&rec.tst!=null) sub.push(`slept ${hm(rec.tst)}${rec.sleep_score!=null?` · score ${rec.sleep_score}`:''}`);
      rows+=`<div class="cal-wk-row ${k===TODAY?'is-today':''}" data-day="${k}">
        <div class="cal-wk-date"><div class="d">${d.getDate()}</div><div class="m">${d.toLocaleDateString('en-GB',{weekday:'short'})}</div></div>
        <div class="cal-wk-mid"><div class="n">${p&&p.hard?'<span class="dot"></span>':''}${planTxt}</div>
          <div class="s">${sub.join(' · ')||'&nbsp;'}</div></div>
        <div class="cal-wk-rt">${p&&p.mi?p.mi+' mi':''}${rec&&rec.readiness!=null?`<br>rdy ${rec.readiness}`:''}</div>
      </div>`;
    }
    body=`<div class="row r3" style="margin-bottom:16px">
        <div class="stat"><div class="k">Logged</div><div class="v">${num(wkMi,1)}<span class="u">mi</span></div><div class="sub">this week</div></div>

  $('#calPrev').addEventListener('click',()=>calShift(-1));
  $('#calNext').addEventListener('click',()=>calShift(1));

    viewCalendar(); animateVisuals($('#v-cal'));
  });
  $('#v-cal').addEventListener('click',e=>{
    const c=e.target.closest('[data-day]'); if(!c) return;
    calSel = calSel===c.dataset.day ? null : c.dataset.day;
    viewCalendar(); animateVisuals($('#v-cal'));

/* ---------- importing your own exports ---------- */
function splitCSV(text,sep){
  const rows=[];let f='',row=[],q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===sep){row.push(f);f='';}
    else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}
    else if(c!=='\r') f+=c;}
  if(f||row.length){row.push(f);rows.push(row);}
  return rows;
}
function guessSep(text){
  const l=text.slice(0,text.indexOf('\n'));
  return l.split(';').length>l.split(',').length?';':',';
}
function upsert(day,patch){
  let r=DATA.daily.find(x=>x.day===day);
  if(!r){r={day,km:0,mi:0,runs:0};DATA.daily.push(r);}
  Object.assign(r,patch); return r;
}
const secs=v=>{const n=parseFloat(v);return isNaN(n)?null:n;};

function importCSV(text,name){
  const sep=guessSep(text), rows=splitCSV(text,sep);
  if(rows.length<2) return {ok:false,msg:name+' — empty'};
  const h=rows[0].map(x=>x.trim()), col=n=>h.indexOf(n);
  const body=rows.slice(1).filter(r=>r.length>1);

  if(col('Date')>=0&&col('Distance')>=0){                       // Garmin activities
    const iD=col('Date'),iX=col('Distance'),iT=col('Time'),iH=col('Avg HR'),
          iM=col('Max HR'),iA=col('Total Ascent'),iE=col('Min Elevation'),iN=col('Title');
    const by={},acts=[];
    body.forEach(r=>{
      if(!r[iD])return;
      const day=r[iD].slice(0,10), km=parseFloat(String(r[iX]).replace(/,/g,''))||0;
      const parts=String(r[iT]).split(':');
      const sec=parts.length===3?Math.round(+parts[0]*3600+ +parts[1]*60+ parseFloat(parts[2])):0;
      const hr=parseFloat(r[iH])||null;
      by[day]=by[day]||{km:0,runs:0,sec:0,hrs:[],elev:null,loc:null};
      by[day].km+=km; by[day].runs++; by[day].sec+=sec; if(hr)by[day].hrs.push(hr);
      const num2=v=>{const n=parseFloat(String(v).replace(/,/g,''));return isNaN(n)?null:Math.round(n)};
      if(by[day].elev==null)by[day].elev=num2(r[iE]);
      if(!by[day].loc)by[day].loc=String(r[iN]||'').replace(' Running','');
      if(km>0&&sec>0){const pc=sec/km;
        acts.push({day,t:String(r[iD]).slice(11,16),km:Math.round(km*100)/100,
          mi:Math.round(km*62.1371)/100,sec,
          pace:Math.floor(pc/60)+':'+String(Math.round(pc%60)).padStart(2,'0'),
          hr,maxhr:parseFloat(r[iM])||null,asc:num2(r[iA]),elev:num2(r[iE]),
          loc:String(r[iN]||'Run').replace(' Running','')});}
    });
    Object.entries(by).forEach(([day,v])=>upsert(day,{
      km:Math.round(v.km*10)/10, mi:Math.round(v.km*6.21371)/10, runs:v.runs,
      min:Math.round(v.sec/60), elev:v.elev, loc:v.loc,
      hr:v.hrs.length?Math.round(v.hrs.reduce((a,b)=>a+b,0)/v.hrs.length):null}));
    acts.sort((a,b)=>(a.day+a.t)<(b.day+b.t)?1:-1);
    DATA.activities=acts;
    return {ok:true,msg:`Garmin — ${acts.length} runs across ${Object.keys(by).length} days`};
  }

  if(col('day')>=0&&col('average_hrv')>=0){                     // Oura sleepmodel
    const g=n=>col(n), iD=g('day');let n=0;
    body.forEach(r=>{
      const tst=secs(r[g('total_sleep_duration')]);
      if(!tst||tst<3*3600)return;
      n++;
      const hh=v=>{const t=String(v).slice(11,16);
        return t.length===5?Math.round((+t.slice(0,2)+ +t.slice(3)/60)*100)/100:null;};
      const lat=secs(r[g('latency')]);
      upsert(String(r[iD]).slice(0,10),{
        tst:Math.round(tst/36)/100,
        awake:Math.round((secs(r[g('awake_time')])||0)/36)/100,
        deep:Math.round((secs(r[g('deep_sleep_duration')])||0)/36)/100,
        rem:Math.round((secs(r[g('rem_sleep_duration')])||0)/36)/100,
        light:Math.round((secs(r[g('light_sleep_duration')])||0)/36)/100,
        tib:Math.round((secs(r[g('time_in_bed')])||0)/36)/100,
        eff:secs(r[g('efficiency')]), hrv:secs(r[g('average_hrv')]),
        rhr:secs(r[g('lowest_heart_rate')]),
        lat:lat?Math.round(lat/60):null,
        restless:secs(r[g('restless_periods')]),
        br:secs(r[g('average_breath')]),
        bed:hh(r[g('bedtime_start')]), wake:hh(r[g('bedtime_end')])});
    });
    return {ok:true,msg:`Oura sleep detail — ${n} nights`};
  }

  if(col('day')>=0&&col('score')>=0){                           // daily sleep / readiness
    const isRead=h.includes('temperature_deviation');
    const iD=col('day'),iS=col('score'),iC=col('contributors');let n=0;
    const store=isRead?(DATA.ready_contrib=DATA.ready_contrib||{}):(DATA.sleep_contrib=DATA.sleep_contrib||{});
    body.forEach(r=>{
      const day=String(r[iD]).slice(0,10); if(!day)return; n++;
      upsert(day,isRead?{readiness:parseFloat(r[iS])||null}:{sleep_score:parseFloat(r[iS])||null});
      if(iC>=0&&r[iC]){ try{ store[day]=JSON.parse(r[iC]); }catch(e){} }
    });
    return {ok:true,msg:`Oura ${isRead?'readiness':'sleep scores'} — ${n} days`};
  }
  return {ok:false,msg:name+' — not a file this app reads'};
}

/* minimal ZIP reader so the Oura export can be dropped in unopened */
async function unzip(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf);
  let eocd=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-66000);i--){
    if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;}
  }
  if(eocd<0) throw new Error('not a zip file');
  const count=dv.getUint16(eocd+10,true);
  let off=dv.getUint32(eocd+16,true);
  const files=[];
  for(let i=0;i<count;i++){
    if(dv.getUint32(off,true)!==0x02014b50) break;
    const method=dv.getUint16(off+10,true);
    const csize=dv.getUint32(off+20,true);
    const nlen=dv.getUint16(off+28,true), elen=dv.getUint16(off+30,true), clen=dv.getUint16(off+32,true);
    const lho=dv.getUint32(off+42,true);
    const name=new TextDecoder().decode(u8.subarray(off+46,off+46+nlen));
    files.push({name,method,csize,lho});
    off+=46+nlen+elen+clen;
  }
  const out={};
  for(const f of files){
    if(!/\.csv$/i.test(f.name)||f.csize===0) continue;
    const ln=dv.getUint16(f.lho+26,true), le=dv.getUint16(f.lho+28,true);
    const start=f.lho+30+ln+le;
    const raw=u8.subarray(start,start+f.csize);
    let bytes;
    if(f.method===0) bytes=raw;
    else if(f.method===8){
      if(typeof DecompressionStream!=='function') throw new Error('this browser cannot open zips — unzip it first');
      const ds=new DecompressionStream('deflate-raw');
      const stream=new Blob([raw]).stream().pipeThrough(ds);
      bytes=new Uint8Array(await new Response(stream).arrayBuffer());
    } else continue;
    out[f.name.split('/').pop()]=new TextDecoder().decode(bytes);
  }
  return out;
}

function recompute(){
  DATA.daily.sort((a,b)=>a.day<b.day?-1:1);
  const kms=DATA.daily.map(r=>r.km||0);
  DATA.daily.forEach((r,i)=>{
    const a=kms.slice(Math.max(0,i-6),i+1), c=kms.slice(Math.max(0,i-27),i+1);
    const atl=a.reduce((x,y)=>x+y,0)/a.length, ctl=c.reduce((x,y)=>x+y,0)/c.length;
    r.atl=Math.round(atl*10)/10; r.ctl=Math.round(ctl*10)/10;
    r.acwr=ctl?Math.round(atl/ctl*100)/100:null;});
  const m={};
  DATA.daily.forEach(r=>{const d=D(r.day),off=(d.getDay()+6)%7,k=kd(new Date(d.getTime()-off*864e5));
    m[k]=m[k]||{start:k,km:0,mi:0,runs:0};
    m[k].km+=r.km||0; m[k].mi+=r.mi||0; m[k].runs+=r.runs||0;});
  DATA.weeks=Object.values(m).sort((a,b)=>a.start<b.start?-1:1)
    .map(w=>({...w,km:Math.round(w.km*10)/10,mi:Math.round(w.mi*10)/10}));
  const mean=f=>{const v=DATA.daily.filter(r=>r[f]!=null).map(r=>r[f]);
    return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;};
  const lastOf=f=>{const v=DATA.daily.filter(r=>r[f]);return v.length?v[v.length-1].day:null;};
  const beds=DATA.daily.filter(r=>r.bed!=null).map(r=>r.bed>18?r.bed-24:r.bed);
  const bm=beds.length?beds.reduce((a,b)=>a+b,0)/beds.length:null;
  const st=DATA.stats;
  st.nights=DATA.daily.filter(r=>r.tst!=null).length;
  st.runs=(DATA.activities||[]).length||DATA.daily.reduce((a,r)=>a+(r.runs||0),0);
  st.total_km=Math.round(kms.reduce((a,b)=>a+b,0));
  st.sleep_mean=mean('tst')?Math.round(mean('tst')*100)/100:null;
  st.awake_mean=mean('awake')?Math.round(mean('awake')*60):null;
  st.eff_mean=mean('eff')?Math.round(mean('eff')):null;
  st.hrv_mean=mean('hrv')?Math.round(mean('hrv')):null;
  st.rhr_mean=mean('rhr')?Math.round(mean('rhr')*10)/10:null;
  st.wake_mean=mean('wake')?Math.round(mean('wake')*100)/100:null;
  st.bed_mean=bm!=null?Math.round((bm+24)*100)/100:null;
  if(beds.length>1){const v=beds.reduce((a,b)=>a+(b-bm)**2,0)/(beds.length-1);
    st.bed_sd=Math.round(Math.sqrt(v)*100)/100;}
  st.oura_last=lastOf('tst'); st.garmin_last=lastOf('runs');
}

const log=[];
function say(html){ log.push(html); const el=$('#log'); if(el) el.innerHTML=log.slice(-8).join('<br>'); }
async function handleFiles(list){
  for(const f of list){
    try{
      if(/\.zip$/i.test(f.name)){
        say(`Opening ${f.name}…`);
        const files=await unzip(await f.arrayBuffer());
        const want=['sleepmodel.csv','dailysleep.csv','dailyreadiness.csv','Activities.csv'];
        let hit=0;
        for(const n of want){ if(files[n]){ const r=importCSV(files[n],n); hit++;
          say(`<span class="${r.ok?'ok':'no'}">${r.ok?'✓':'✗'}</span> ${r.msg}`);}}
        if(!hit) say(`<span class="no">✗</span> ${f.name} — no readable CSVs inside`);
      } else {
        const r=importCSV(await f.text(),f.name);
        say(`<span class="${r.ok?'ok':'no'}">${r.ok?'✓':'✗'}</span> ${r.msg}`);
      }
    }catch(e){ say(`<span class="no">✗</span> ${f.name} — ${e.message}`); }
  }
  recompute(); render(); openPanel(true);
  const sb=$('#saveBtn'); if(sb) sb.disabled=false;
}

function saveCopy(){
  document.getElementById('snap').textContent=JSON.stringify(DATA);
  document.getElementById('snapplan').textContent=JSON.stringify(PLAN);
  const html='<!doctype html>'+document.documentElement.outerHTML;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));
  a.download=`splitsheet-${TODAY}.html`;
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

let panelOpen=false;
async function openPanel(force){
  panelOpen=force!=null?force:!panelOpen;
  const el=$('#panel'); el.classList.toggle('hide',!panelOpen);
  if(!panelOpen) return;

  el.innerHTML=`<div class="card"><h2>Link your accounts</h2><p class="sub">Loading…</p></div>`;

  let s=null;
  try{ const r=await fetch('/api/status'); if(r.ok) s=await r.json(); }catch(e){}

  if(!s){
    el.innerHTML=`<div class="card"><h2>Link your accounts</h2>
      <p class="sub">This only works while the app is running on its own server — not when the file
      is just opened on its own. If you're already on the hosted version, refresh and try again.</p>
    </div>`;
    return;
  }

  const row=(dot,name,tag,sub,action)=>`
    <div class="acct-row">
      <span class="acct-dot ${dot?'on':''}"></span>
      <div class="acct-body">
        <div class="acct-name">${name}${tag?`<span class="acct-tag">${tag}</span>`:''}</div>
        <div class="acct-sub">${sub}</div>
      </div>
      ${action}
    </div>`;

  const connectBtn=(href)=>`<a class="acct-btn connect" href="${href}">Connect</a>`;
  const disconnectBtn=(href)=>`<a class="acct-btn disconnect" href="${href}">Disconnect</a>`;

  el.innerHTML=`
  <div class="card">
    <h2>Link your accounts</h2>
    <p class="sub">Oura and Strava sync automatically once connected. Garmin comes in through
      Strava — that's the only route Garmin allows.</p>
    <div style="margin-top:6px">
      ${row(s.oura,'Oura','','Sleep, HRV, readiness, resting heart rate.',
        s.oura?disconnectBtn('/disconnect/oura'):connectBtn('/connect/oura'))}
      ${row(s.strava,'Strava','','Every run, synced the moment Garmin uploads it.',
        s.strava?disconnectBtn('/disconnect/strava'):connectBtn('/connect/strava'))}
      ${row(s.strava,'Garmin','via Strava',
        s.strava?'Connected — arriving automatically through Strava above.'
                 :'Connect Strava above first. Garmin has no direct connection of its own; Garmin Connect already auto-uploads every run to Strava, and this app reads it from there.','')}
      ${row(false,'Apple Health','not linkable',
        'Apple keeps Health data on your phone with no cloud access at all — even the Health app itself can\'t be reached from a website. The only way in is a native iPhone app, which is a different kind of project to this one.','')}
      ${row(false,'Samsung Health','not linkable',
        'Samsung requires a vetted developer application before issuing API access — there\'s no self-serve connect button anyone can click, ours included.','')}
    </div>
  </div>
  <div class="card">
    <button class="manual-toggle" id="manualToggle">Or import a file manually instead ↓</button>
    <div id="manualBox" class="hide" style="margin-top:16px">
      <div class="dz" id="dz">
        <div class="big2">Drop your export files here</div>
        <div class="sm">or <label for="fi">choose files</label> — the Oura zip works as-is</div>
        <input type="file" id="fi" multiple accept=".csv,.zip">
      </div>
      <div class="log" id="log">${log.slice(-8).join('<br>')||'Nothing loaded yet.'}</div>
      <button class="savebtn" id="saveBtn" ${log.length?'':'disabled'}>Save this as my app</button>
      <div class="sm" style="color:var(--dim);font-size:11.5px;margin-top:9px;text-align:center">
        Saving downloads a copy with your latest data inside. Open that file next time.</div>
      <p class="sub" style="margin-top:14px">
        Garmin: connect.garmin.com → Activities → All Activities → the export icon. Oura:
        cloud.ouraring.com → Account → Export Data — drop the zip in unopened.
        Everything is read inside this page; nothing is uploaded anywhere.</p>
    </div>
  </div>`;

  $('#manualToggle').addEventListener('click',()=>{
    const box=$('#manualBox'); const open=box.classList.toggle('hide');
    $('#manualToggle').textContent=open?'Or import a file manually instead ↓':'Hide manual import ↑';
  });
  $('#fi').addEventListener('change',e=>handleFiles([...e.target.files]));
  $('#saveBtn').addEventListener('click',saveCopy);
  const dz=$('#dz');
  ['dragenter','dragover'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.add('over');}));
  ['dragleave','drop'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.remove('over');}));
  dz.addEventListener('drop',e=>handleFiles([...e.dataTransfer.files]));
}

async function boot(){
  let live=false, s={}, hasData=false;
  try{
    s = await (await fetch('/api/status')).json();
    live = true;                              // server answered — we're running hosted, not as a plain file
  }catch(e){ /* opened as a plain file, or server unreachable */ }

  if(live){
    try{
      const d = await fetch('/api/data');
      if(d.ok){ DATA = await d.json(); hasData = true; }
    }catch(e){}
    try{
      const p = await fetch('/api/plan');
      if(p.ok){ const pj = await p.json(); if(pj && Object.keys(pj).length) PLAN = pj; }
    }catch(e){}
    coachLive=!!(s.configured&&s.configured.anthropic);
    if(coachLive) await coachLoadHistory();
  }
  render();
  if(live){
    const dot=(on,name)=>`<span style="color:${on?'var(--gym)':'var(--dim)'}">●</span> ${name}`;
    $('#sync').innerHTML=`
      <div style="display:flex;gap:16px;justify-content:center;flex-wrap:wrap;align-items:center">
        ${dot(s.oura,'Oura')}
        ${dot(s.strava,'Strava')}
        ${s.last?`<span>synced ${s.last} UTC</span>`:(hasData?'':'<span>nothing linked yet — tap Link accounts above</span>')}
        <button id="sb">Sync now</button>
      </div>`;
    const b=$('#sb');
    if(b) b.onclick=async()=>{
      b.textContent='Syncing…'; b.disabled=true;
      try{
        const r=await (await fetch('/api/sync')).json();
        if(r.ok){ DATA=await (await fetch('/api/data')).json(); render(); b.textContent='Synced'; }
        else { b.textContent='Failed'; alert(`Strava: ${r.strava||'—'}\nOura: ${r.oura||'—'}`); }
      }catch(e){ b.textContent='Failed'; }
      setTimeout(()=>{b.disabled=false;b.textContent='Sync now';},2500);
    };
  } else {
    $('#sync').innerHTML=`Data to ${DATA.stats.garmin_last} · ${DATA.stats.nights} nights, ${DATA.stats.runs} runs`;
  }
}
boot();
</script>
