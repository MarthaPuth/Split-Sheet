<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Split Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0D14; --surf:#141926; --surf2:#1D2433; --line:#262E40;
  --tx:#EDF0F6; --mut:#8A93A8; --dim:#5D677D;
  --sleep:#6FD3E0; --run:#F5A05A; --ready:#A98BFA; --gym:#6EE7A0; --warn:#F2707E; --coach:#E5A8E8;
  --a1:#A98BFA; --a2:#6FD3E0; --glow:.4;
  --f:'Inter',system-ui,-apple-system,sans-serif; --m:'DM Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--f);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:84px}
.mono{font-family:var(--m);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
.wrap{max-width:940px;margin:0 auto;padding:0 16px}

/* top */
.hd{padding:22px 0 16px}
.hd .d{font-size:12.5px;color:var(--mut);letter-spacing:.03em}
.hd h1{font-size:25px;margin-top:3px}
.hd .cd{font-family:var(--m);font-size:12px;color:var(--dim);margin-top:5px}
.hd .cd b{color:var(--run);font-weight:500}

/* nav */
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,13,20,.93);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--dim);padding:11px 4px 13px;cursor:pointer;font-family:var(--f);font-size:10.5px;font-weight:500;letter-spacing:.04em}
nav button .ic{display:block;font-size:17px;line-height:1;margin-bottom:5px}
nav button[aria-selected=true]{color:var(--tx)}
nav button[aria-selected=true].t-sleep{color:var(--sleep)}
nav button[aria-selected=true].t-runs{color:var(--run)}
nav button[aria-selected=true].t-today{color:var(--ready)}
nav button[aria-selected=true].t-gym{color:var(--gym)}
nav button[aria-selected=true].t-coach{color:var(--coach)}
nav button:focus-visible{outline:2px solid var(--tx);outline-offset:-3px}
@media(min-width:720px){
  body{padding-bottom:24px;padding-top:0}
  nav{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);max-width:940px;margin:0 auto;padding:0 16px}
  nav button{flex:0 0 auto;padding:16px 20px 14px;font-size:13px;border-bottom:2px solid transparent}
  nav button .ic{display:none}
  nav button[aria-selected=true]{border-color:currentColor}
}

/* cards */
.card{background:var(--surf);border-radius:16px;padding:20px;margin-bottom:12px}
.card>h2{font-size:13px;color:var(--mut);font-weight:500;letter-spacing:.05em;text-transform:uppercase;margin-bottom:14px}
.row{display:grid;gap:12px}
.r2{grid-template-columns:1fr 1fr}
.r3{grid-template-columns:repeat(3,1fr)}
@media(max-width:560px){.r3{grid-template-columns:1fr 1fr}}

/* ring */
.ringbox{display:flex;align-items:center;gap:22px}
.ringbox .meta{min-width:0}
.ringbox .big{font-size:30px;font-weight:700;letter-spacing:-.02em}
.ringbox .lab{font-size:13px;color:var(--mut);margin-top:2px}
.ringbox .note{font-size:13px;color:var(--dim);margin-top:9px;line-height:1.45}
.ring{flex:0 0 auto;position:relative}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .val .n{font-family:var(--m);font-size:26px;font-weight:500;line-height:1}
.ring .val .s{font-size:9.5px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin-top:3px}

/* stat */
.stat{background:var(--surf2);border-radius:12px;padding:14px}
.stat .k{font-size:11px;color:var(--mut);letter-spacing:.04em}
.stat .v{font-family:var(--m);font-size:22px;margin-top:6px;line-height:1.1}
.stat .u{font-size:11px;color:var(--dim);margin-left:3px}
.stat .sub{font-size:11.5px;color:var(--dim);margin-top:4px}

/* contributor bars */
.cb{margin-bottom:13px}
.cb:last-child{margin-bottom:0}
.cb .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.cb .t span:last-child{font-family:var(--m);color:var(--mut)}
.cb .bar{height:5px;border-radius:3px;background:var(--surf2);overflow:hidden}
.cb .bar i{display:block;height:100%;border-radius:3px}

/* stage bar */
.stages{display:flex;height:30px;border-radius:8px;overflow:hidden;margin:4px 0 12px}
.stages div{display:flex;align-items:center;justify-content:center;font-family:var(--m);font-size:10px;color:#0A0D14;font-weight:500}
.slegend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--mut)}
.slegend i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:6px}

/* list */
.li{display:flex;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0;padding-bottom:0}
.li:first-child{padding-top:0}
.li .dt{flex:0 0 44px;text-align:center}
.li .dt .dd{font-family:var(--m);font-size:17px;line-height:1}
.li .dt .mo{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.li .mid{flex:1;min-width:0}
.li .mid .n{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .mid .s{font-size:12px;color:var(--dim);margin-top:3px;font-family:var(--m)}
.li .rt{text-align:right;font-family:var(--m);flex:0 0 auto}
.li .rt .a{font-size:15px}
.li .rt .b{font-size:11px;color:var(--dim);margin-top:3px}
.pill{display:inline-block;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:20px;font-family:var(--f);font-weight:600;vertical-align:1px;margin-left:7px}

/* session */
.sess{background:var(--surf2);border-radius:12px;padding:16px;margin-bottom:10px;border-left:3px solid var(--run)}
.sess.strength{border-left-color:var(--gym)}
.sess.rest{border-left-color:var(--dim)}
.sess .tag{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--mut)}
.sess .nm{font-size:18px;font-weight:600;margin:5px 0 3px}
.sess .dt2{font-size:13px;color:var(--mut)}
.sess .vol{float:right;font-family:var(--m);font-size:13px;color:var(--run)}

/* timeline */
.tl{position:relative;padding-left:20px}
.tl:before{content:'';position:absolute;left:4px;top:6px;bottom:6px;width:1px;background:var(--line)}
.tli{position:relative;padding:0 0 18px}
.tli:last-child{padding-bottom:0}
.tli:before{content:'';position:absolute;left:-20px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--surf2);border:1px solid var(--line)}
.tli.key:before{background:var(--ready);border-color:var(--ready)}
.tli .tm{font-family:var(--m);font-size:11.5px;color:var(--ready);letter-spacing:.03em}
.tli .tx{font-size:13.5px;color:var(--mut);margin-top:3px;line-height:1.45}
.tli.key .tx{color:var(--tx)}

/* chart */
svg.ch{width:100%;height:auto;display:block}
.chl{display:flex;gap:15px;flex-wrap:wrap;font-size:11px;color:var(--dim);margin-top:11px;font-family:var(--m)}
.chl i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px}

/* misc */
.note{font-size:13px;color:var(--mut);line-height:1.55}
.note b{color:var(--tx);font-weight:600}
.hide{display:none}
.seg{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.seg button{background:var(--surf2);border:0;color:var(--mut);font-family:var(--f);font-size:12px;padding:7px 13px;border-radius:20px;cursor:pointer}
.seg button[aria-selected=true]{background:var(--tx);color:var(--bg);font-weight:600}
.bar-mini{height:4px;border-radius:2px;background:var(--surf2);overflow:hidden;margin-top:8px}
.bar-mini i{display:block;height:100%;border-radius:2px}
.hd{position:relative}
.upd{position:absolute;top:22px;right:0;background:var(--surf2);border:0;color:var(--tx);
  font-family:var(--f);font-size:12px;font-weight:500;padding:9px 15px;border-radius:20px;cursor:pointer}
.upd:active{opacity:.7}
.dz{border:1.5px dashed var(--line);border-radius:14px;padding:26px 18px;text-align:center;background:var(--surf2);transition:border-color .15s}
.dz.over{border-color:var(--sleep)}
.dz .big2{font-size:15px;font-weight:600;margin-bottom:5px}
.dz .sm{font-size:12.5px;color:var(--mut)}
.dz input{position:absolute;width:1px;height:1px;opacity:0}
.dz label{color:var(--sleep);text-decoration:underline;cursor:pointer}
.steps{counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding:0 0 15px 32px;font-size:13.5px;color:var(--mut);line-height:1.5}
.steps li:last-child{padding-bottom:0}
.steps li:before{content:counter(s);position:absolute;left:0;top:0;width:21px;height:21px;border-radius:50%;
  background:var(--surf2);color:var(--tx);font-family:var(--m);font-size:11px;display:flex;align-items:center;justify-content:center}
.steps li b{color:var(--tx);font-weight:600}
.log{font-family:var(--m);font-size:12px;color:var(--mut);margin-top:14px;line-height:1.7}
.log .ok{color:var(--gym)} .log .no{color:var(--warn)}
.savebtn{background:var(--tx);color:var(--bg);border:0;font-family:var(--f);font-size:13px;font-weight:600;
  padding:12px 20px;border-radius:22px;cursor:pointer;margin-top:16px;width:100%}
.savebtn[disabled]{opacity:.35;cursor:default}
.sync{font-family:var(--m);font-size:11px;color:var(--dim);text-align:center;padding:18px 0 4px}
.sync button{background:none;border:1px solid var(--line);color:var(--mut);font-family:var(--m);font-size:11px;padding:6px 13px;border-radius:20px;cursor:pointer;margin-left:8px}

/* ---------- aurora: a mood-lit backdrop that dims on rough days ---------- */
#aurora{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background:var(--bg)}
#aurora i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(70px);
  opacity:var(--glow,.4);transition:opacity 1.1s ease,background 1.1s ease}
#aurora i:nth-child(1){left:-20vmax;top:-28vmax;background:radial-gradient(circle,var(--a1) 0%,transparent 70%);
  animation:drift1 26s ease-in-out infinite}
#aurora i:nth-child(2){right:-24vmax;top:-10vmax;background:radial-gradient(circle,var(--a2) 0%,transparent 70%);
  animation:drift2 32s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(4vmax,3vmax) scale(1.08)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-3vmax,4vmax) scale(1.05)}}
@media(prefers-reduced-motion:reduce){#aurora i{animation:none!important}}

/* ---------- ring fill-in + number count-up ---------- */
.ring circle[data-off]{transition:stroke-dashoffset 1.1s cubic-bezier(.16,1,.3,1)}
@media(prefers-reduced-motion:reduce){.ring circle[data-off]{transition:none}}

/* ---------- card entrance ---------- */
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card,.tile{animation:cardIn .5s cubic-bezier(.16,1,.3,1) both}
.card:nth-of-type(1),.tile:nth-of-type(1){animation-delay:0ms}
.card:nth-of-type(2),.tile:nth-of-type(2){animation-delay:40ms}
.card:nth-of-type(3),.tile:nth-of-type(3){animation-delay:80ms}
.card:nth-of-type(4),.tile:nth-of-type(4){animation-delay:120ms}
.card:nth-of-type(5){animation-delay:160ms}
.card:nth-of-type(6){animation-delay:200ms}
@media(prefers-reduced-motion:reduce){.card,.tile{animation:none}}

/* ---------- tab crossfade ---------- */
.view-pane{animation:paneIn .32s ease both}
@keyframes paneIn{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.view-pane{animation:none}}

/* ---------- tap feedback ---------- */
button{-webkit-tap-highlight-color:transparent}
nav button,.seg button,.tabs button,.savebtn,.upd,.sync button,.coach-chip,.coach-send{
  transition:transform .12s ease,opacity .12s ease}
nav button:active,.seg button:active,.tabs button:active,.savebtn:active,.upd:active,
.sync button:active,.coach-chip:active,.coach-send:active{transform:scale(.95);opacity:.85}

/* ---------- coach ---------- */
.coach-wrap{display:flex;flex-direction:column;height:calc(100vh - 260px);min-height:420px}
.coach-log{flex:1;overflow-y:auto;padding:2px 2px 14px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:82%;padding:12px 15px;border-radius:16px;font-size:14px;line-height:1.5;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--ready);color:#0A0D14;border-bottom-right-radius:5px;font-weight:500}
.msg.coach{align-self:flex-start;background:var(--surf2);border-bottom-left-radius:5px;color:var(--tx)}
.msg.sys{align-self:center;color:var(--dim);font-size:12.5px;background:none;padding:4px}
.typing{align-self:flex-start;background:var(--surf2);border-radius:16px;border-bottom-left-radius:5px;
  padding:13px 16px;display:flex;gap:5px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--dim);animation:tbounce 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tbounce{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:2px 0 14px}
.coach-chip{background:var(--surf2);border:1px solid var(--line);color:var(--mut);font-family:var(--f);
  font-size:12.5px;padding:9px 14px;border-radius:20px;cursor:pointer;text-align:left}
.coach-input{display:flex;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.coach-input textarea{flex:1;resize:none;background:var(--surf2);border:1px solid var(--line);border-radius:14px;
  color:var(--tx);font-family:var(--f);font-size:14.5px;padding:12px 14px;max-height:110px}
.coach-input textarea:focus{outline:2px solid var(--ready);outline-offset:1px}
.coach-send{background:var(--ready);color:#0A0D14;border:0;border-radius:14px;padding:0 18px;font-weight:600;
  cursor:pointer;font-size:14px}
.coach-send[disabled]{opacity:.4;cursor:default}
.coach-note{font-size:11.5px;color:var(--dim);text-align:center;padding:10px 8px 0}
.coach-empty{text-align:center;padding:40px 20px;color:var(--dim)}
.coach-empty .ic{font-size:30px;margin-bottom:10px;display:block}
.coach-clear{font-family:var(--m);font-size:10.5px;color:var(--dim);background:none;border:0;
  cursor:pointer;text-decoration:underline}
</style>

<script>
const SNAP=JSON.parse(document.getElementById('snap').textContent);
const SNAPPLAN=JSON.parse(document.getElementById('snapplan').textContent);
let DATA=SNAP, PLAN=SNAPPLAN;
const $=s=>document.querySelector(s);
const D=s=>new Date(s+'T00:00:00');
const kd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const NAT='2026-11-21', REG='2026-11-13';
const dd=(a,b)=>Math.round((D(b)-D(a))/864e5);
const num=(v,d=0)=>v==null||isNaN(v)?'–':(+v).toFixed(d);
const hm=h=>h==null?'–':`${Math.floor(h)}h ${String(Math.round((h%1)*60)).padStart(2,'0')}m`;
const clock=h=>h==null?'–':`${String(Math.floor(h)).padStart(2,'0')}:${String(Math.round((h%1)*60)).padStart(2,'0')}`;
let TODAY=kd(new Date());

/* ---------- shared bits ---------- */
function ring(score,color,sub,size=104,stroke=9){
  const r=(size-stroke)/2, c=2*Math.PI*r, pct=Math.max(0,Math.min(100,score||0));
  const off=c*(1-pct/100);
  return `<div class="ring" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surf2)" stroke-width="${stroke}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-off="${off}"/>
    </svg>
    <div class="val"><span class="n" data-count="${score==null?'':Math.round(score)}">${score==null?'–':'0'}</span><span class="s">${sub}</span></div></div>`;
}

/* reveals rings and counts up numbers after the DOM has actually painted */
function animateVisuals(root){
  const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const scope=root||document;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    scope.querySelectorAll('circle[data-off]').forEach(c=>{ c.style.strokeDashoffset=c.dataset.off; });
    scope.querySelectorAll('[data-count]').forEach(el=>{
      const raw=el.dataset.count; if(raw===''){ return; }
      const target=+raw;
      if(reduced){ el.textContent=target; return; }
      const start=performance.now(), dur=700;
      const step=now=>{
        const t=Math.min(1,(now-start)/dur), e=1-Math.pow(1-t,3);
        el.textContent=Math.round(target*e);
        if(t<1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
  }));
}
function bars(obj,color,labels){
  return Object.entries(obj||{}).filter(([,v])=>v!=null).map(([k,v])=>
    `<div class="cb"><div class="t"><span>${labels[k]||k.replace(/_/g,' ')}</span><span>${Math.round(v)}</span></div>
     <div class="bar"><i style="width:${Math.max(2,Math.min(100,v))}%;background:${color}"></i></div></div>`).join('');
}
function trend(rows,field,color,h=110,band){
  const v=rows.filter(r=>r[field]!=null);
  if(v.length<2) return '<div class="note">Not enough data yet.</div>';
  const W=600, mn=Math.min(...v.map(r=>r[field])), mx=Math.max(...v.map(r=>r[field])), rg=(mx-mn)||1;
  const x=i=>i/(v.length-1)*(W-8)+4, y=z=>h-8-((z-mn)/rg)*(h-22);
  const pts=v.map((r,i)=>[x(i),y(r[field])]);
  let s='';
  if(band!=null&&band>=mn&&band<=mx) s+=`<line x1="4" y1="${y(band)}" x2="${W-4}" y2="${y(band)}" stroke="${color}" stroke-dasharray="3 5" opacity=".35"/>`;
  s+=`<polyline fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p=>p.join(',')).join(' ')}"/>`;
  s+=`<circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="3.5" fill="${color}"/>`;
  return `<svg class="ch" viewBox="0 0 ${W} ${h}" preserveAspectRatio="none" role="img" aria-label="${field} trend">${s}</svg>
    <div class="chl"><span>${v[0].day.slice(5)}</span><span style="margin-left:auto">${v[v.length-1].day.slice(5)} · now ${num(v[v.length-1][field],1)}</span></div>`;
}
const nights=()=>DATA.daily.filter(r=>r.tst!=null);
const lastNight=()=>nights().slice(-1)[0]||{};
const runDays=()=>DATA.daily.filter(r=>r.km>0);

/* ---------- TODAY ---------- */
const DAYPLANS={
 quality:[['06:00','Wake. 500 ml water with a pinch of salt, daylight on your eyes inside ten minutes.',0],
  ['06:20','60–80 g carbohydrate that sits easily — toast and honey, banana, sports drink.',1],
  ['07:00','Session. At altitude judge it on heart rate, not pace.',1],
  ['08:30','Inside 45 minutes: 25–30 g protein plus 80–100 g carbohydrate. This is the meal that matters most today.',1],
  ['12:30','Full lunch, carbohydrate-forward, salt with it. Iron-rich protein two or three times a week.',0],
  ['13:30','Twenty to thirty minutes flat, eyes shut.',1],
  ['15:30','Snack, 40–60 g carbohydrate, about ninety minutes before the second run.',0],
  ['17:00','Second run or the second threshold block.',1],
  ['19:00','Dinner. Biggest carbohydrate serve of the day, protein again.',0],
  ['21:30','Screens down, room cold and dark.',0],
  ['22:15','Lights out. Same time regardless of how today went.',1]],
 long:[['06:15','Wake, fluids first.',0],
  ['06:45','90–100 g carbohydrate. Never start anything over 100 minutes empty.',1],
  ['07:45','Long run. 30–60 g carbohydrate an hour past the 75-minute mark.',1],
  ['10:15','Refuel: 25–30 g protein, 100 g+ carbohydrate, fluid at roughly 1.5× what you lost.',1],
  ['11:30','Legs up, twenty minutes.',0],
  ['13:00','Lunch, unhurried and large.',0],
  ['15:00','Mobility or yoga. Easy — not a second session.',0],
  ['19:00','Dinner. Carbohydrate again; you are refilling for two days.',0],
  ['21:45','Earlier than a weekday. This is the night the adaptation happens.',1]],
 easy:[['06:30','Wake.',0],
  ['07:00','Aerobic run. Heart rate drifting high at normal pace means shorten it, not push through.',1],
  ['08:15','Breakfast, protein-forward. Iron with vitamin C, an hour clear of coffee and dairy.',0],
  ['12:30','Lunch.',0],
  ['16:30','Second run or core. Strides on the days they are written.',0],
  ['19:00','Dinner.',0],
  ['20:30','Sauna if it is a heat day — 20 minutes, three hours clear of bed.',0],
  ['22:15','Lights out. Same time as every other night.',1]],
 rest:[['07:30','Sleep in if your body wants it. This is the one day it is allowed.',1],
  ['09:00','Breakfast, protein-forward. Do not under-eat on a rest day — you are still repairing.',1],
  ['11:00','Twenty minutes walking or easy mobility. Movement, not training.',0],
  ['13:00','Lunch as normal. Rest days are when the week actually lands.',0],
  ['16:00','Yoga. Hips, calves, hamstrings.',0],
  ['19:00','Dinner.',0],
  ['21:00','Sauna if you use it. Nothing else.',0],
  ['22:15','Lights out. Same time.',1]]};
function dayType(p){
  if(!p) return 'easy';
  if(p.rest) return 'rest';
  const n=(p.items[0]&&p.items[0].name||'').toLowerCase();
  if(n.includes('long')) return 'long';
  if(p.hard) return 'quality';
  return 'easy';
}
function viewToday(){
  const p=PLAN[TODAY], ln=lastNight(), t=dayType(p);
  const lbl={quality:'Quality day',long:'Long run day',easy:'Easy day',rest:'Rest day'}[t];
  const acwr=DATA.daily.filter(r=>r.day<=TODAY&&r.acwr!=null).slice(-1)[0];
  const load=acwr?acwr.acwr:null;
  let verdict;
  if(ln.readiness==null) verdict='No ring data for last night, so today is on feel. Warm up and judge the first ten minutes honestly.';
  else if(ln.readiness>=85) verdict='Green light. Take the session as written.';
  else if(ln.readiness>=70) verdict='Normal. Run the session, but let heart rate govern the effort rather than pace.';
  else verdict='Low. Do the session at the easy end of the range, or move it a day. Nothing is won by forcing this one.';
  $('#v-today').innerHTML=`
  <div class="card"><div class="ringbox">
    ${ring(ln.readiness,'var(--ready)','ready')}
    <div class="meta"><div class="big">${lbl}</div>
      <div class="lab">${p?p.items.map(i=>i.name).join(' · '):'Nothing scheduled'}</div>
      <div class="note">${verdict}</div></div></div></div>

  <div class="row r3">
    <div class="stat"><div class="k">Slept</div><div class="v">${ln.tst!=null?hm(ln.tst):'–'}</div>
      <div class="sub">${ln.eff!=null?ln.eff+'% efficient':'no data'}</div></div>
    <div class="stat"><div class="k">HRV</div><div class="v">${num(ln.hrv)}<span class="u">ms</span></div>
      <div class="sub">${DATA.stats.hrv_mean?'avg '+DATA.stats.hrv_mean:''}</div></div>
    <div class="stat"><div class="k">Load ratio</div><div class="v">${load!=null?load.toFixed(2):'–'}</div>
      <div class="sub">${load==null?'':(load>1.5?'climbing fast':load<0.8?'easing':'in range')}</div></div>
  </div>

  <div class="card"><h2>Scheduled</h2>
    ${p?p.items.map(i=>`<div class="sess ${/strength|core|mobility/i.test(i.tag)?'strength':''} ${p.rest?'rest':''}">
      ${i.vol?`<span class="vol">${i.vol}</span>`:''}<div class="tag">${i.tag}</div>
      <div class="nm">${i.name}</div>${i.det?`<div class="dt2">${i.det}</div>`:''}</div>`).join('')
      :'<div class="note">No session on file for today. The plan runs to 23 August — add the next block to <b>plan.json</b>.</div>'}
  </div>

  <div class="card"><h2>Recovery and fuelling · ${lbl.toLowerCase()}</h2>
    <div class="tl">${DAYPLANS[t].map(r=>`<div class="tli ${r[2]?'key':''}"><div class="tm">${r[0]}</div><div class="tx">${r[1]}</div></div>`).join('')}</div>
  </div>`;
}

/* ---------- SLEEP ---------- */
function viewSleep(){
  const ns=nights(), ln=lastNight(), st=DATA.stats;
  const c=(DATA.sleep_contrib||{})[ln.day];
  const stages=[['Deep',ln.deep,'var(--sleep)'],['REM',ln.rem,'#8FA9F0'],['Light',ln.light,'#3E5877'],['Awake',ln.awake,'#2A3244']];
  const tot=stages.reduce((a,b)=>a+(b[1]||0),0)||1;
  const last30=ns.slice(-30);
  const beds=ns.filter(r=>r.bed!=null).map(r=>r.bed>18?r.bed-24:r.bed);
  const bsd=beds.length>1?(()=>{const m=beds.reduce((a,b)=>a+b,0)/beds.length;
    return Math.sqrt(beds.reduce((a,b)=>a+(b-m)**2,0)/(beds.length-1))})():null;
  $('#v-sleep').innerHTML=`
  <div class="card"><div class="ringbox">
    ${ring(ln.sleep_score,'var(--sleep)','sleep')}
    <div class="meta"><div class="big">${hm(ln.tst)}</div>
      <div class="lab">${ln.day?D(ln.day).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'}):''}</div>
      <div class="note">In bed ${hm(ln.tib)} · asleep ${hm(ln.tst)} · awake ${ln.awake!=null?Math.round(ln.awake*60)+' min':'–'}</div></div></div>
    <div class="stages" style="margin-top:18px">
      ${stages.map(s=>`<div style="width:${((s[1]||0)/tot)*100}%;background:${s[2]}">${(s[1]||0)/tot>0.12?s[0]:''}</div>`).join('')}
    </div>
    <div class="slegend">${stages.map(s=>`<span><i style="background:${s[2]}"></i>${s[0]} ${hm(s[1])}</span>`).join('')}</div>
  </div>

  <div class="row r3">
    <div class="stat"><div class="k">HRV</div><div class="v">${num(ln.hrv)}<span class="u">ms</span></div><div class="sub">avg ${num(st.hrv_mean)}</div></div>
    <div class="stat"><div class="k">Resting HR</div><div class="v">${num(ln.rhr)}<span class="u">bpm</span></div><div class="sub">avg ${num(st.rhr_mean,1)}</div></div>

function coachEscape(s){

}

  $('#v-coach').innerHTML=`
  <div class="card" style="padding-bottom:14px">

      ${!coachMsgs.length?`<div class="chips" id="coachChips">
        ${COACH_CHIPS.map(c=>`<button class="coach-chip" data-q="${coachEscape(c)}">${c}</button>`).join('')}
      </div>`:''}
      <div class="coach-input">
        <textarea id="coachBox" rows="1" placeholder="${coachLive?'Ask your coach…':'Connect this once your app is deployed with an API key'}" ${coachLive?'':'disabled'}></textarea>
        <button class="coach-send" id="coachSend" ${coachLive?'':'disabled'}>Send</button>
      </div>
      <div class="coach-note">General guidance only, grounded in your data — not a diagnosis. See a physio or doctor for anything that doesn't ease up.
        ${coachMsgs.length?' · <button class="coach-clear" id="coachClear">Clear conversation</button>':''}</div>
    </div>
  </div>`;
  drawCoachLog();
  const box=$('#coachBox'), send=$('#coachSend');
  if(box){
    box.addEventListener('input',()=>{ box.style.height='auto'; box.style.height=Math.min(110,box.scrollHeight)+'px'; });
    box.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); coachSend(box.value); } });
  }
  if(send) send.addEventListener('click',()=>coachSend(box.value));
  const chips=$('#coachChips');
  if(chips) chips.addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) coachSend(b.dataset.q); });
  const clr=$('#coachClear');

async function coachSend(text){
  text=(text||'').trim(); if(!text||coachBusy||!coachLive) return;
  coachMsgs.push({role:'user',content:text});
  coachBusy=true;
  const box=$('#coachBox'); if(box){ box.value=''; box.style.height='auto'; }
  viewCoach();
  try{
    const r=await fetch('/api/coach',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:text})});
    const d=await r.json();
    coachBusy=false;
    if(d.reply) coachMsgs.push({role:'assistant',content:d.reply});
    else coachMsgs.push({role:'assistant',content:'That didn\'t go through: '+(d.error||'unknown error')+'. Try again in a moment.'});
  }catch(e){
    coachBusy=false;
    coachMsgs.push({role:'assistant',content:'Could not reach the coach — check your connection and try again.'});
  }
  viewCoach();
}
async function coachClear(){
  coachMsgs=[];
  try{ await fetch('/api/coach/history',{method:'DELETE'}); }catch(e){}
  viewCoach();
}
async function coachLoadHistory(){
  try{
    const r=await fetch('/api/coach/history');
    if(!r.ok) return;
    const d=await r.json();
    coachMsgs=(d.messages||[]).map(m=>({role:m.role,content:m.content}));
    coachLive=true;
  }catch(e){}
}

/* ---------- importing your own exports ---------- */
function splitCSV(text,sep){
  const rows=[];let f='',row=[],q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===sep){row.push(f);f='';}
    else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}
    else if(c!=='\r') f+=c;}
  if(f||row.length){row.push(f);rows.push(row);}
  return rows;
}
function guessSep(text){
  const l=text.slice(0,text.indexOf('\n'));
  return l.split(';').length>l.split(',').length?';':',';
}
function upsert(day,patch){
  let r=DATA.daily.find(x=>x.day===day);
  if(!r){r={day,km:0,mi:0,runs:0};DATA.daily.push(r);}
  Object.assign(r,patch); return r;
}
const secs=v=>{const n=parseFloat(v);return isNaN(n)?null:n;};

function importCSV(text,name){
  const sep=guessSep(text), rows=splitCSV(text,sep);
  if(rows.length<2) return {ok:false,msg:name+' — empty'};
  const h=rows[0].map(x=>x.trim()), col=n=>h.indexOf(n);
  const body=rows.slice(1).filter(r=>r.length>1);

  if(col('Date')>=0&&col('Distance')>=0){                       // Garmin activities
    const iD=col('Date'),iX=col('Distance'),iT=col('Time'),iH=col('Avg HR'),
          iM=col('Max HR'),iA=col('Total Ascent'),iE=col('Min Elevation'),iN=col('Title');
    const by={},acts=[];
    body.forEach(r=>{
      if(!r[iD])return;
      const day=r[iD].slice(0,10), km=parseFloat(String(r[iX]).replace(/,/g,''))||0;
      const parts=String(r[iT]).split(':');
      const sec=parts.length===3?Math.round(+parts[0]*3600+ +parts[1]*60+ parseFloat(parts[2])):0;
      const hr=parseFloat(r[iH])||null;
      by[day]=by[day]||{km:0,runs:0,sec:0,hrs:[],elev:null,loc:null};
      by[day].km+=km; by[day].runs++; by[day].sec+=sec; if(hr)by[day].hrs.push(hr);
      const num2=v=>{const n=parseFloat(String(v).replace(/,/g,''));return isNaN(n)?null:Math.round(n)};
      if(by[day].elev==null)by[day].elev=num2(r[iE]);
      if(!by[day].loc)by[day].loc=String(r[iN]||'').replace(' Running','');
      if(km>0&&sec>0){const pc=sec/km;
        acts.push({day,t:String(r[iD]).slice(11,16),km:Math.round(km*100)/100,
          mi:Math.round(km*62.1371)/100,sec,
          pace:Math.floor(pc/60)+':'+String(Math.round(pc%60)).padStart(2,'0'),
          hr,maxhr:parseFloat(r[iM])||null,asc:num2(r[iA]),elev:num2(r[iE]),
          loc:String(r[iN]||'Run').replace(' Running','')});}
    });
    Object.entries(by).forEach(([day,v])=>upsert(day,{
      km:Math.round(v.km*10)/10, mi:Math.round(v.km*6.21371)/10, runs:v.runs,
      min:Math.round(v.sec/60), elev:v.elev, loc:v.loc,
      hr:v.hrs.length?Math.round(v.hrs.reduce((a,b)=>a+b,0)/v.hrs.length):null}));
    acts.sort((a,b)=>(a.day+a.t)<(b.day+b.t)?1:-1);
    DATA.activities=acts;
    return {ok:true,msg:`Garmin — ${acts.length} runs across ${Object.keys(by).length} days`};
  }

  if(col('day')>=0&&col('average_hrv')>=0){                     // Oura sleepmodel
    const g=n=>col(n), iD=g('day');let n=0;
    body.forEach(r=>{
      const tst=secs(r[g('total_sleep_duration')]);
      if(!tst||tst<3*3600)return;
      n++;
      const hh=v=>{const t=String(v).slice(11,16);
        return t.length===5?Math.round((+t.slice(0,2)+ +t.slice(3)/60)*100)/100:null;};
      const lat=secs(r[g('latency')]);
      upsert(String(r[iD]).slice(0,10),{
        tst:Math.round(tst/36)/100,
        awake:Math.round((secs(r[g('awake_time')])||0)/36)/100,
        deep:Math.round((secs(r[g('deep_sleep_duration')])||0)/36)/100,
        rem:Math.round((secs(r[g('rem_sleep_duration')])||0)/36)/100,
        light:Math.round((secs(r[g('light_sleep_duration')])||0)/36)/100,
        tib:Math.round((secs(r[g('time_in_bed')])||0)/36)/100,
        eff:secs(r[g('efficiency')]), hrv:secs(r[g('average_hrv')]),
        rhr:secs(r[g('lowest_heart_rate')]),
        lat:lat?Math.round(lat/60):null,
        restless:secs(r[g('restless_periods')]),
        br:secs(r[g('average_breath')]),
        bed:hh(r[g('bedtime_start')]), wake:hh(r[g('bedtime_end')])});
    });
    return {ok:true,msg:`Oura sleep detail — ${n} nights`};
  }

  if(col('day')>=0&&col('score')>=0){                           // daily sleep / readiness
    const isRead=h.includes('temperature_deviation');
    const iD=col('day'),iS=col('score'),iC=col('contributors');let n=0;
    const store=isRead?(DATA.ready_contrib=DATA.ready_contrib||{}):(DATA.sleep_contrib=DATA.sleep_contrib||{});
    body.forEach(r=>{
      const day=String(r[iD]).slice(0,10); if(!day)return; n++;
      upsert(day,isRead?{readiness:parseFloat(r[iS])||null}:{sleep_score:parseFloat(r[iS])||null});
      if(iC>=0&&r[iC]){ try{ store[day]=JSON.parse(r[iC]); }catch(e){} }
    });
    return {ok:true,msg:`Oura ${isRead?'readiness':'sleep scores'} — ${n} days`};
  }
  return {ok:false,msg:name+' — not a file this app reads'};
}

/* minimal ZIP reader so the Oura export can be dropped in unopened */
async function unzip(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf);
  let eocd=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-66000);i--){
    if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;}
  }
  if(eocd<0) throw new Error('not a zip file');
  const count=dv.getUint16(eocd+10,true);
  let off=dv.getUint32(eocd+16,true);
  const files=[];
  for(let i=0;i<count;i++){
    if(dv.getUint32(off,true)!==0x02014b50) break;
    const method=dv.getUint16(off+10,true);
    const csize=dv.getUint32(off+20,true);
    const nlen=dv.getUint16(off+28,true), elen=dv.getUint16(off+30,true), clen=dv.getUint16(off+32,true);
    const lho=dv.getUint32(off+42,true);
    const name=new TextDecoder().decode(u8.subarray(off+46,off+46+nlen));
    files.push({name,method,csize,lho});
    off+=46+nlen+elen+clen;
  }
  const out={};
  for(const f of files){
    if(!/\.csv$/i.test(f.name)||f.csize===0) continue;
    const ln=dv.getUint16(f.lho+26,true), le=dv.getUint16(f.lho+28,true);
    const start=f.lho+30+ln+le;
    const raw=u8.subarray(start,start+f.csize);
    let bytes;
    if(f.method===0) bytes=raw;
    else if(f.method===8){
      if(typeof DecompressionStream!=='function') throw new Error('this browser cannot open zips — unzip it first');
      const ds=new DecompressionStream('deflate-raw');
      const stream=new Blob([raw]).stream().pipeThrough(ds);
      bytes=new Uint8Array(await new Response(stream).arrayBuffer());
    } else continue;
    out[f.name.split('/').pop()]=new TextDecoder().decode(bytes);
  }
  return out;
}

function recompute(){
  DATA.daily.sort((a,b)=>a.day<b.day?-1:1);
  const kms=DATA.daily.map(r=>r.km||0);
  DATA.daily.forEach((r,i)=>{
    const a=kms.slice(Math.max(0,i-6),i+1), c=kms.slice(Math.max(0,i-27),i+1);
    const atl=a.reduce((x,y)=>x+y,0)/a.length, ctl=c.reduce((x,y)=>x+y,0)/c.length;
    r.atl=Math.round(atl*10)/10; r.ctl=Math.round(ctl*10)/10;
    r.acwr=ctl?Math.round(atl/ctl*100)/100:null;});
  const m={};
  DATA.daily.forEach(r=>{const d=D(r.day),off=(d.getDay()+6)%7,k=kd(new Date(d.getTime()-off*864e5));
    m[k]=m[k]||{start:k,km:0,mi:0,runs:0};
    m[k].km+=r.km||0; m[k].mi+=r.mi||0; m[k].runs+=r.runs||0;});
  DATA.weeks=Object.values(m).sort((a,b)=>a.start<b.start?-1:1)
    .map(w=>({...w,km:Math.round(w.km*10)/10,mi:Math.round(w.mi*10)/10}));
  const mean=f=>{const v=DATA.daily.filter(r=>r[f]!=null).map(r=>r[f]);
    return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;};
  const lastOf=f=>{const v=DATA.daily.filter(r=>r[f]);return v.length?v[v.length-1].day:null;};
  const beds=DATA.daily.filter(r=>r.bed!=null).map(r=>r.bed>18?r.bed-24:r.bed);
  const bm=beds.length?beds.reduce((a,b)=>a+b,0)/beds.length:null;
  const st=DATA.stats;
  st.nights=DATA.daily.filter(r=>r.tst!=null).length;
  st.runs=(DATA.activities||[]).length||DATA.daily.reduce((a,r)=>a+(r.runs||0),0);
  st.total_km=Math.round(kms.reduce((a,b)=>a+b,0));
  st.sleep_mean=mean('tst')?Math.round(mean('tst')*100)/100:null;
  st.awake_mean=mean('awake')?Math.round(mean('awake')*60):null;
  st.eff_mean=mean('eff')?Math.round(mean('eff')):null;
  st.hrv_mean=mean('hrv')?Math.round(mean('hrv')):null;
  st.rhr_mean=mean('rhr')?Math.round(mean('rhr')*10)/10:null;
  st.wake_mean=mean('wake')?Math.round(mean('wake')*100)/100:null;
  st.bed_mean=bm!=null?Math.round((bm+24)*100)/100:null;
  if(beds.length>1){const v=beds.reduce((a,b)=>a+(b-bm)**2,0)/(beds.length-1);
    st.bed_sd=Math.round(Math.sqrt(v)*100)/100;}
  st.oura_last=lastOf('tst'); st.garmin_last=lastOf('runs');
}

const log=[];
function say(html){ log.push(html); const el=$('#log'); if(el) el.innerHTML=log.slice(-8).join('<br>'); }
async function handleFiles(list){
  for(const f of list){
    try{
      if(/\.zip$/i.test(f.name)){
        say(`Opening ${f.name}…`);
        const files=await unzip(await f.arrayBuffer());
        const want=['sleepmodel.csv','dailysleep.csv','dailyreadiness.csv','Activities.csv'];
        let hit=0;
        for(const n of want){ if(files[n]){ const r=importCSV(files[n],n); hit++;
          say(`<span class="${r.ok?'ok':'no'}">${r.ok?'✓':'✗'}</span> ${r.msg}`);}}
        if(!hit) say(`<span class="no">✗</span> ${f.name} — no readable CSVs inside`);
      } else {
        const r=importCSV(await f.text(),f.name);
        say(`<span class="${r.ok?'ok':'no'}">${r.ok?'✓':'✗'}</span> ${r.msg}`);
      }
    }catch(e){ say(`<span class="no">✗</span> ${f.name} — ${e.message}`); }
  }
  recompute(); render(); openPanel(true);
  const sb=$('#saveBtn'); if(sb) sb.disabled=false;
}

function saveCopy(){
  document.getElementById('snap').textContent=JSON.stringify(DATA);
  document.getElementById('snapplan').textContent=JSON.stringify(PLAN);
  const html='<!doctype html>'+document.documentElement.outerHTML;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));
  a.download=`splitsheet-${TODAY}.html`;
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

let panelOpen=false;
function openPanel(force){
  panelOpen=force!=null?force:!panelOpen;
  const el=$('#panel'); el.classList.toggle('hide',!panelOpen);
  if(!panelOpen) return;
  el.innerHTML=`<div class="card"><h2>Update your data</h2>
    <div class="dz" id="dz">
      <div class="big2">Drop your export files here</div>
      <div class="sm">or <label for="fi">choose files</label> — the Oura zip works as-is</div>
      <input type="file" id="fi" multiple accept=".csv,.zip">
    </div>
    <div class="log" id="log">${log.slice(-8).join('<br>')||'Nothing loaded yet.'}</div>
    <button class="savebtn" id="saveBtn" ${log.length?'':'disabled'}>Save this as my app</button>
    <div class="sm" style="color:var(--dim);font-size:11.5px;margin-top:9px;text-align:center">
      Saving downloads a copy with your latest data inside. Open that file next time.</div>
  </div>
  <div class="card"><h2>Where to get the files</h2>
    <ol class="steps">
      <li><b>Garmin</b> — connect.garmin.com → Activities → All Activities → the export icon top right. You get <b>Activities.csv</b>.</li>
      <li><b>Oura</b> — cloud.ouraring.com → Account → Export Data. They email you a zip. Drop the whole zip in, unopened.</li>
      <li>Everything is read inside this page. Nothing is uploaded anywhere.</li>
    </ol></div>`;
  $('#fi').addEventListener('change',e=>handleFiles([...e.target.files]));
  $('#saveBtn').addEventListener('click',saveCopy);
  const dz=$('#dz');
  ['dragenter','dragover'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.add('over');}));
  ['dragleave','drop'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.remove('over');}));
  dz.addEventListener('drop',e=>handleFiles([...e.dataTransfer.files]));
}

async function boot(){
  let live=false, s={};
  try{
    const [d,p]=await Promise.all([
      fetch('/api/data').then(r=>r.ok?r.json():Promise.reject()),
      fetch('/api/plan').then(r=>r.ok?r.json():{}).catch(()=>({}))]);
    DATA=d; PLAN=p&&Object.keys(p).length?p:SNAPPLAN; live=true;
  }catch(e){ /* opened as a plain file — use the snapshot */ }
  if(live){
    try{ s=await (await fetch('/api/status')).json(); }catch(e){}
    coachLive=!!(s.configured&&s.configured.anthropic);
    if(coachLive) await coachLoadHistory();
  }
  render();
  if(live){
    const chip=(on,name,href)=>on
      ? `<span style="color:var(--gym)">●</span> ${name}`
      : `<a href="${href}" style="color:var(--sleep);text-decoration:none">Connect ${name}</a>`;
    $('#sync').innerHTML=`
      <div style="display:flex;gap:16px;justify-content:center;flex-wrap:wrap;align-items:center">
        ${chip(s.oura,'Oura','/connect/oura')}
        ${chip(s.strava,'Strava','/connect/strava')}
        ${s.last?`<span>synced ${s.last} UTC</span>`:''}
        <button id="sb">Sync now</button>
      </div>`;
    const b=$('#sb');
    if(b) b.onclick=async()=>{
      b.textContent='Syncing…'; b.disabled=true;
      try{
        const r=await (await fetch('/api/sync')).json();
        if(r.ok){ DATA=await (await fetch('/api/data')).json(); render(); b.textContent='Synced'; }
        else { b.textContent='Failed'; alert(`Strava: ${r.strava||'—'}\nOura: ${r.oura||'—'}`); }
      }catch(e){ b.textContent='Failed'; }
      setTimeout(()=>{b.disabled=false;b.textContent='Sync now';},2500);
    };
  } else {
    $('#sync').innerHTML=`Data to ${DATA.stats.garmin_last} · ${DATA.stats.nights} nights, ${DATA.stats.runs} runs`;
  }
}
boot();
</script>
